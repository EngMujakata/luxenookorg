<style>
:root{--bg:#f1f7ff;--c:#fff;--t:#10233f;--g:#62748d;--b:#1769e0;--bd:#0d4fac;--bs:#e4f0ff;--l:#dbe7f6;--in:#f6faff;--ok:#0e9f6e;--bad:#dc2626;--sh:0 1px 2px rgba(16,35,63,.05),0 10px 24px -14px rgba(23,105,224,.28);--f:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none}
.hdr{position:fixed;top:0;left:0;right:0;height:58px;padding:0 max(14px,3vw);padding-top:env(safe-area-inset-top);background:var(--c);border-bottom:1px solid var(--l);display:flex;align-items:center;gap:10px;z-index:7}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;letter-spacing:-.4px;color:var(--b)}.brand img{height:34px;border-radius:9px}.sp{flex:1}
.ib{width:40px;height:40px;border-radius:50%;border:0;background:var(--bg);color:var(--g);display:grid;place-items:center}.ib:hover{background:var(--l)}
#app{padding:70px max(14px,3vw) 40px;max-width:1160px;margin:auto}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;background:var(--bg);color:var(--t);display:inline-flex;gap:8px;align-items:center;justify-content:center}.btn:hover{background:var(--l)}
.btn.p{background:var(--b);color:#fff;box-shadow:0 8px 18px -10px var(--b)}.btn.p:hover{background:var(--bd)}.btn.d{color:var(--bad)}.btn.o{background:transparent;border:1px solid var(--l)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:9px}.btn[disabled]{opacity:.5;pointer-events:none}.full{width:100%}
.card{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.in,input,select,textarea{width:100%;padding:11px 13px;margin:4px 0;border:1px solid var(--l);border-radius:12px;background:var(--in);color:var(--t);font:inherit;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--b);box-shadow:0 0 0 3px rgba(23,105,224,.18)}input[type=checkbox],input[type=radio]{width:auto;margin:0}
.fg{margin-bottom:10px}.fg label{display:block;font-size:12px;font-weight:700;color:var(--g)}.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.m,small{color:var(--g)}.emp{text-align:center;padding:36px 10px;color:var(--g);grid-column:1/-1}
.hero{padding:34px 0 10px}.hero h1{font-size:clamp(30px,5vw,52px);line-height:1.05;letter-spacing:-1.8px;margin:0 0 10px;max-width:720px}.hero p{color:var(--g);max-width:540px;margin:0 0 18px}
.srch{display:flex;align-items:center;gap:8px;background:var(--c);border:1px solid var(--l);border-radius:99px;padding:0 6px 0 16px;color:var(--g);max-width:560px;margin-bottom:6px}.srch input{border:0;background:none;margin:0;box-shadow:none!important}
.chips,.tabs{display:flex;gap:8px;margin:14px 0;overflow-x:auto;scrollbar-width:none}
.chip,.tab{border:0;background:var(--c);border:1px solid var(--l);color:var(--g);border-radius:99px;padding:7px 15px;font-weight:700;white-space:nowrap}.chip.on,.tab.on{background:var(--b);border-color:var(--b);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.cc{background:var(--c);border:1px solid var(--l);border-radius:16px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;box-shadow:var(--sh)}
.cc .im{aspect-ratio:16/10;background:var(--bs) center/cover}.cc .bd{padding:14px;display:flex;flex-direction:column;gap:4px;flex:1}.cc h3{font-size:16px;line-height:1.25;margin:0}
.cc p{font-size:13px;color:var(--g);margin:0}.meta{display:flex;gap:12px;font-size:12px;color:var(--g);margin-top:auto;padding-top:8px;flex-wrap:wrap}
.tag,.badge{display:inline-block;background:var(--bs);color:var(--b);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700}.badge.g{background:#d9f5ea;color:#066b4a}.badge.w{background:#fff1c9;color:#8a5a00}.badge.r{background:#fde2e2;color:#a31616}
.price{font-weight:800;color:var(--b)}
.sk{height:210px;border-radius:16px;margin-bottom:14px;background:linear-gradient(90deg,var(--c) 25%,var(--l) 37%,var(--c) 63%);background-size:400% 100%;animation:sh 1.3s infinite}@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}
.cd{display:grid;grid-template-columns:1.3fr .7fr;gap:26px;align-items:start}.cd .im{aspect-ratio:16/10;border-radius:16px;background:var(--bs) center/cover}.cd h1{font-size:clamp(26px,4vw,40px);letter-spacing:-1.2px;line-height:1.1;margin:8px 0}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:8px;background:var(--c);border:1px solid var(--l);border-radius:14px}.item>.pi{flex:1;min-width:0}.item .pi small{display:block}
.ls{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--l)}.ls:last-child{border:0}
.ico{width:34px;height:34px;border-radius:10px;background:var(--bs);color:var(--b);display:grid;place-items:center;flex:none}
.bar{height:6px;background:var(--l);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--b)}
.learn{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}.side{position:sticky;top:70px;max-height:calc(100vh - 90px);overflow:auto}
.li{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:10px;font-weight:600}.li:hover,.li.on{background:var(--bs)}
.ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--l);flex:none;display:grid;place-items:center;font-size:11px;color:#fff}.ck.d{background:var(--ok);border-color:var(--ok)}
.vw{aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden;display:grid;place-items:center;color:#cbd5e1;text-align:center}.vw video,.vw iframe,.vw img{width:100%;height:100%;border:0;object-fit:contain;user-select:none}
.prose p,.prose ul{margin:0 0 12px}.prose{max-width:70ch}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:14px}.st div{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:14px}.st b{display:block;font-size:24px;letter-spacing:-.6px}.st span{font-size:12px;color:var(--g)}
.modal{position:fixed;inset:0;background:rgba(6,14,30,.62);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;animation:fd .18s}
.modal>div{background:var(--c);border-radius:20px;padding:20px;width:min(540px,100%);max-height:90vh;overflow:auto;box-shadow:0 30px 70px -20px #0008}.modal.l>div{width:min(860px,100%)}
@media(max-width:640px){.modal{align-items:flex-end;padding:0}.modal>div{border-radius:22px 22px 0 0}.cd,.learn,.fr{grid-template-columns:1fr}.side{position:static;max-height:none}}
@keyframes fd{from{opacity:0}}
#toast{position:fixed;top:68px;left:50%;transform:translateX(-50%);background:#0e1b33;color:#fff;padding:11px 18px;border-radius:12px;z-index:60;display:none;max-width:92%;font-weight:600;font-size:14px}
.ov{position:fixed;inset:0;z-index:50;background:rgba(6,14,30,.5);display:grid;place-items:center;backdrop-filter:blur(2px)}
.pcard{background:var(--c);border-radius:22px;padding:24px 30px;text-align:center;min-width:210px;box-shadow:0 30px 70px -20px #0008;animation:pp .2s}@keyframes pp{from{transform:translateY(12px);opacity:0}}
.ring{position:relative;width:92px;height:92px;margin:auto}.ring svg{width:92px;height:92px;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:3.2}.ring .bg{stroke:var(--l)}.ring .fg2{stroke:var(--b);stroke-linecap:round;transition:stroke-dasharray .2s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:19px;font-weight:800}.pcard p{margin:12px 0 0;font-weight:600;color:var(--g);font-size:14px}
.q{padding:16px 0;border-bottom:1px solid var(--l)}.q label{display:flex;gap:10px;padding:9px 12px;border:1px solid var(--l);border-radius:10px;margin-top:8px;cursor:pointer}.q label:has(input:checked){border-color:var(--b);background:var(--bs)}
.timer{position:sticky;top:62px;z-index:5;background:var(--c);border:1px solid var(--l);border-radius:12px;padding:12px 16px;display:flex;justify-content:space-between;font-weight:800;margin-bottom:12px}.timer.low{color:var(--bad);border-color:var(--bad)}
.cert{background:#fff;color:#14213d;border:10px solid var(--a);padding:12px;text-align:center}.cert .ci{border:1px solid #cbd5e1;padding:30px 16px}.cert .ct{font-size:28px;font-weight:800;color:var(--a)}.cert .cn{font-size:28px;font-weight:800;margin:12px 0;border-bottom:2px solid var(--a);display:inline-block;padding:0 22px}
.cert p{color:#64748b;margin:6px 0}.cert h3{font-size:21px}.cert .cs{display:flex;gap:20px;margin-top:26px}.cert .cs div{flex:1;border-top:1px solid #94a3b8;padding-top:6px}.cert .cs b{display:block}.cert .cs span,.cert small{font-size:11px;color:#64748b}
@media print{.hdr,#app,#toast,.noprint{display:none!important}.modal{position:static;background:none;padding:0}.modal>div{box-shadow:none;padding:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="toast"></div>
<header class="hdr"><a class="brand" href="#/"><img src="./logo-192.png" alt="" onerror="this.remove()">Luxenook</a><div class="sp"></div><div id="nav" style="display:flex;gap:8px;align-items:center"></div><button class="ib" id="th" aria-label="Switch theme"></button></header>
<main id="app"></main>
<script>
const API="https://script.google.com/macros/s/AKfycbyAJdtiCt3X3E6AUYUHB_40s-8sM2oZ9Mv6G6wze-uuAkddupGLA8YJ851fErLjwxxr/exec";
const $=s=>document.querySelector(s),app=$("#app"),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS=(k,v)=>{try{return v===undefined?JSON.parse(localStorage.getItem(k)):localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms)),uuid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+""+Math.random();
const fmtD=t=>new Date(Number(t)).toLocaleDateString(undefined,{day:"numeric",month:"long",year:"numeric"}),money=n=>Number(n)?"$"+Number(n).toFixed(2):"Free";
const cvr=u=>u?`style="background-image:url('${esc(u)}')"`:"";
let S=LS("lx"),IO=null;
const P=d=>`<svg viewBox="0 0 24 24">${d}</svg>`,I={sun:P('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),moon:P('<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>')};
/* theme: light (default blue) / dark, remembers choice, follows system until chosen */
const isDark=()=>{const d=localStorage.d;return d==="1"||(d==null&&matchMedia("(prefers-color-scheme:dark)").matches)};
function theme(){document.body.toggleAttribute("data-d",isDark());$("#th").innerHTML=isDark()?I.sun:I.moon;document.querySelector("meta[name=theme-color]").content=isDark()?"#0a1322":"#1769e0"}
$("#th").onclick=()=>{localStorage.d=isDark()?"0":"1";theme()};theme();
const toast=m=>{const t=$("#toast");t.textContent=(m&&m.message)||m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",3800)};
/* API: every request has an id so a retried write is applied once; reads and writes auto-retry on network errors */
class ApiErr extends Error{constructor(m,r){super(m);this.retry=!!r}}
async function call(a,d,rid,ms){const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),ms||60000);
 try{const res=await fetch(API,{method:"POST",body:JSON.stringify({a,t:S&&S.token,rid,...d}),signal:ctl.signal,redirect:"follow"});let j;
  try{j=await res.json()}catch(e){throw new ApiErr("The server sent an unexpected reply. Please try again.",1)}
  if(!j.success){if(j.message==="SESSION_EXPIRED"){signOut(1);throw new ApiErr("Your session expired. Please sign in again.")}throw new ApiErr(j.message||"Request failed.",!!j.busy)}return j}
 catch(e){if(e instanceof ApiErr)throw e;if(e&&e.name==="AbortError")throw new ApiErr("The server took too long. Please try again.",1);if(e instanceof TypeError)throw new ApiErr("Cannot connect. Check your internet connection.",1);throw new ApiErr(String(e&&e.message||e))}finally{clearTimeout(t)}}
async function api(a,d={},ms){const rid=uuid(),ret=!["upload","upStart","upChunk"].includes(a);for(let i=0;;i++){try{return await call(a,d,rid,ms)}catch(e){if(!(ret&&e.retry&&i<2))throw e;await sleep(700*(i+1))}}}
/* progress ring overlay for every write: blocks double taps, shows 0-100% */
let isBusy=0;
function busy(label){const o=document.createElement("div");o.className="ov";o.innerHTML=`<div class="pcard"><div class="ring"><svg viewBox="0 0 36 36"><circle class="bg" cx="18" cy="18" r="15.9"/><circle class="fg2" id="rg" cx="18" cy="18" r="15.9" pathLength="100" stroke-dasharray="0 100"/></svg><b id="pp">0%</b></div><p id="pl">${label}</p></div>`;document.body.append(o);
 let p=0,real=0;const set=v=>{p=Math.max(p,Math.min(100,v));$("#rg").setAttribute("stroke-dasharray",p+" 100");$("#pp").textContent=Math.round(p)+"%"};
 const t=setInterval(()=>{if(!real&&p<90)set(p+(90-p)*.08+.4)},120);
 return{set:(v,l)=>{real=1;set(v);if(l)$("#pl").textContent=l},end:async ok=>{clearInterval(t);if(ok){set(100);await sleep(240)}o.remove()}}}
const W=(label,f)=>async(...a)=>{if(isBusy)return;isBusy=1;const b=busy(label);let ok=0;try{const r=await f(b,...a);ok=1;return r}catch(e){toast(e)}finally{await b.end(ok);isBusy=0}};
const sk=n=>'<div class="sk"></div>'.repeat(n);
function sheet(h,l){const m=document.createElement("div");m.className="modal"+(l?" l":"");m.innerHTML=`<div>${h}</div>`;m.onmousedown=e=>{if(e.target===m)m.remove()};document.body.append(m);return m}
const closeM=()=>document.querySelectorAll(".modal").forEach(m=>m.remove());
/* lazy list: 10 per page, loads as you scroll; first page of public lists is cached for instant paint */
function lazy(el,fetch,render,ck,cls){let p=0,more=true,bz=false;el.innerHTML=`<div class="${cls||""}"></div><div></div>`;const L=el.children[0],Sn=el.children[1],c=ck&&LS("c_"+ck);if(c)L.innerHTML=c.map(render).join("");
 const o=new IntersectionObserver(e=>e[0].isIntersecting&&load(),{rootMargin:"400px"});
 async function load(){if(!el.isConnected){o.disconnect();return}if(bz||!more)return;bz=true;if(!L.innerHTML)Sn.innerHTML=sk(3);else if(p)Sn.innerHTML=sk(1);
  try{const r=await fetch(p);if(!p){L.innerHTML="";if(ck)LS("c_"+ck,r.items)}L.insertAdjacentHTML("beforeend",r.items.map(render).join(""));if(!p&&!r.items.length)L.innerHTML='<div class="emp">Nothing here yet.</div>';p++;more=r.more;if(!more)o.disconnect()}
  catch(e){toast(e)}finally{bz=false;Sn.innerHTML="";if(more&&el.isConnected)setTimeout(()=>{if(Sn.getBoundingClientRect().top<innerHeight+300)load()},60)}}
 o.observe(Sn);load()}
/* files */
const shrink=(f,m=1400)=>new Promise(r=>{const i=new Image;i.onload=()=>{const k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);c.toBlob(b=>r(b||f),"image/jpeg",.82)};i.onerror=()=>r(f);i.src=URL.createObjectURL(f)});
const b64=b=>new Promise((r,j)=>{const x=new FileReader;x.onload=()=>r(String(x.result).split(",")[1]);x.onerror=()=>j("Cannot read the file.");x.readAsDataURL(b)});
async function putChunk(uploadId,offset,blob){let f=0;for(;;){try{return await api("upChunk",{uploadId,offset,data:await b64(blob)},180000)}catch(e){const m=String(e.message||e);if(++f>=4||/expired|Invalid|Allowed/i.test(m))throw m;await sleep(1500*f)}}}
// small files: one call. big files: resumable 3 MB chunks straight to Drive; progress is real.
async function upFile(cid,f,pub,b,lo,hi,lab){let blob=f,mime=f.type||"application/octet-stream";lab=lab||"Uploading";
 if(pub&&/^image\/(jpeg|png|webp)/.test(mime)){blob=await shrink(f);mime=blob.type||mime}
 if(!blob.size)throw"That file is empty.";
 if(blob.size<=1.5e6){b.set(lo+(hi-lo)*.15,lab);return api("upload",{courseId:cid,fileName:f.name,mimeType:mime,pub,data:await b64(blob)},120000)}
 const st=await api("upStart",{courseId:cid,fileName:f.name,mimeType:mime,totalBytes:blob.size,pub},60000);let off=0,r;
 while(off<blob.size){r=await putChunk(st.uploadId,off,blob.slice(off,Math.min(off+st.chunk,blob.size)));off=r.done?blob.size:(Number(r.next)||0);b.set(lo+(hi-lo)*off/blob.size,lab+" "+Math.round(off/blob.size*100)+"%")}
 return r}
/* offline store (IndexedDB) */
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open("luxenook",1);r.onupgradeneeded=()=>r.result.createObjectStore("media",{keyPath:"id"});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
async function idbOp(mode,fn){const db=await idb();return new Promise((ok,no)=>{const t=db.transaction("media",mode),q=fn(t.objectStore("media"));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error)})}
const idbGet=id=>idbOp("readonly",s=>s.get(id)),idbAll=()=>idbOp("readonly",s=>s.getAll()),idbPut=o=>idbOp("readwrite",s=>s.put(o)),idbDel=id=>idbOp("readwrite",s=>s.delete(id)),idbClear=()=>idbOp("readwrite",s=>s.clear());

/* header + auth */
function nav(){$("#nav").innerHTML=!S?`<button class="btn sm" onclick="authM('in')">Sign in</button><button class="btn p sm" onclick="authM('up')">Create account</button>`:`<a class="btn sm" href="#/${S.role==="admin"?"admin":"me"}">${S.role==="admin"?"Admin":"My learning"}</a><button class="btn sm" onclick="signOut()">Sign out</button>`}
function authM(mode){sheet(mode==="up"?`<h2>Create your account</h2><p class="m">Browse for free. Create an account to request a course.</p>
 <div class="fr"><div class="fg"><label>First name</label><input id="fn"></div><div class="fg"><label>Last name</label><input id="ln"></div></div><div class="fg"><label>Email</label><input id="em" type="email"></div><div class="fg"><label>Username</label><input id="un"></div><div class="fg"><label>Password (6+ characters)</label><input id="pw" type="password"></div>
 <button class="btn p full" onclick="doSignup()">Create account</button><p class="m" style="text-align:center">Have an account? <a href="#" onclick="authM('in');return false">Sign in</a></p>`
 :`<h2>Welcome back</h2><div class="fg"><label>Account type</label><select id="rl"><option value="student">Student</option><option value="admin">Administrator</option></select></div><div class="fg"><label>Username or email</label><input id="un" autocomplete="username"></div>
 <div class="fg"><label>Password</label><input id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div><button class="btn p full" onclick="doLogin()">Sign in</button><p class="m" style="text-align:center">New here? <a href="#" onclick="authM('up');return false">Create an account</a></p>`)}
const setSession=s=>{S=s;LS("lx",s);closeM();nav();location.hash=s.role==="admin"?"#/admin":"#/me";route()};
const doSignup=W("Creating your account",async b=>{const v=i=>$("#"+i).value.trim();setSession((await api("signup",{firstName:v("fn"),lastName:v("ln"),email:v("em"),username:v("un"),password:$("#pw").value})).session)});
const doLogin=W("Signing you in",async b=>setSession((await api("login",{role:$("#rl").value,username:$("#un").value,password:$("#pw").value})).session));
function signOut(silent){S=null;localStorage.removeItem("lx");idbClear().catch(()=>{});nav();if(!silent)toast("Signed out.");location.hash="#/";route()}
const chPw=()=>{const s=sheet(`<h3>Change password</h3><input id="op" type="password" placeholder="Current password"><input id="np" type="password" placeholder="New password (6+ characters)"><button class="btn p full" id="cpk">Save</button>`);$("#cpk").onclick=W("Saving",async()=>{await api("changePassword",{oldPassword:$("#op").value,newPassword:$("#np").value});s.remove();toast("Password updated.")})};

/* router */
function route(){if(IO){IO.disconnect();IO=null}closeM();clearInterval(X.iv);scrollTo(0,0);const p=(location.hash.slice(2)||"").split("/");
 const v={"":home,course:()=>courseView(p[1]),learn:()=>learn(p[1]),exam:()=>examView(p[1]),me:dash,admin:()=>p[1]==="course"?editor(p[2]):admin(p[1]||"overview")}[p[0]]||home;
 Promise.resolve(v()).catch(e=>{app.innerHTML=`<div class="card emp">${esc(e.message||e)}<br><br><a class="btn p" href="#/">Back to courses</a></div>`})}

/* home: 10 courses at a time, thumbnails only */
let H={q:"",cat:""};
function home(){app.innerHTML=`<section class="hero"><h1>Learn skills. Earn a certificate.</h1><p>Short courses with video, reading and a timed exam. Browse freely, sign in when you are ready to learn.</p>
 <div class="srch"><input id="q" placeholder="Search courses" value="${esc(H.q)}"><button class="btn p sm" onclick="hRun()">Search</button></div></section><div class="chips" id="chips"></div><div id="ls"></div>`;
 $("#q").onkeydown=e=>e.key==="Enter"&&hRun();const cc=LS("c_cats");const dc=r=>{$("#chips").innerHTML=["All",...r].map(c=>`<button class="chip ${(c==="All"&&!H.cat)||c===H.cat?"on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("")};if(cc)dc(cc);
 api("getCategories").then(r=>{LS("c_cats",r.categories);dc(r.categories)}).catch(()=>{});
 $("#chips").onclick=e=>{const b=e.target.closest("[data-c]");if(!b)return;H.cat=b.dataset.c==="All"?"":b.dataset.c;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===b));hList()};hList()}
function hRun(){H.q=$("#q").value.trim();hList()}
function hList(){lazy($("#ls"),p=>api("getCourses",{offset:p*10,limit:10,q:H.q,category:H.cat}).then(r=>({items:r.courses,more:r.hasMore})),c=>`<article class="cc" onclick="location.hash='#/course/${c.id}'"><div class="im" ${cvr(c.image)}></div><div class="bd"><span class="m">${esc(c.category)}</span><h3>${esc(c.title)}</h3><p>${esc(c.summary)}</p><div class="meta"><span class="price">${money(c.price)}</span><span>${c.lessons} lessons</span><span>${esc(c.level)}</span></div></div></article>`,!H.q&&!H.cat?"courses":"","grid")}

/* course page: details load only when opened */
const TI={video:"▶",link:"▶",text:"≡",pdf:"▤",image:"▧"};
async function courseView(id){app.innerHTML=sk(1);const r=await api("getCourse",{id}),c=r.course;
 const cta={none:`<button class="btn p" onclick="reqAccess('${c.id}')">${Number(c.price)?"Request access":"Start for free"}</button>`,pending:`<span class="badge w">Awaiting admin approval</span><p class="m">You can start once your payment is confirmed.</p>`,approved:`<a class="btn p" href="#/learn/${c.id}">${S&&S.role==="admin"?"Preview course":"Continue learning"}</a>`,rejected:`<span class="badge r">Access not granted</span> <button class="btn o sm" onclick="reqAccess('${c.id}')">Request again</button>`}[r.status];
 window.CT=r.certificate;
 app.innerHTML=`<div class="cd"><div><span class="tag">${esc(c.category)}</span><h1>${esc(c.title)}</h1><p class="m" style="white-space:pre-line">${esc(c.description)}</p><div class="meta" style="margin:14px 0"><span>${c.lessons} lessons</span><span>${esc(c.duration)}</span><span>${esc(c.level)}</span>${c.questionCount?`<span>Exam: ${c.questionCount} questions${c.examMinutes?", "+c.examMinutes+" min":""}, pass at ${c.passMark}%</span>`:""}</div>
 <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><b class="price" style="font-size:24px">${money(c.price)}</b><div>${cta}</div></div>${r.certificate?`<p><button class="btn sm" onclick="viewCert(CT)">View your certificate</button></p>`:""}</div><div class="im" ${cvr(c.image)}></div></div>
 <div class="card" style="margin-top:24px"><h3>What's inside</h3><p class="m">Lessons unlock after your access is approved.</p>${r.lessons.map(l=>`<div class="ls"><div class="ico">${TI[l.type]||"•"}</div><b style="font-size:14px">${esc(l.title)}</b>${r.done.includes(l.id)?'<span class="badge g" style="margin-left:auto">Done</span>':""}</div>`).join("")||'<div class="emp">Lessons are coming soon.</div>'}</div>`}
const reqAccess=W("Sending request",async(b,id)=>{if(!S){authM("up");return}if(S.role!=="student")throw"Use a student account to request access.";const r=await api("requestAccess",{courseId:id});toast(r.status==="approved"?"You're in. Enjoy the course.":"Request sent. The administrator will approve it once payment is confirmed.");courseView(id)});

/* learning player */
let L={};
async function learn(id){if(!S)return authM("in");app.innerHTML=sk(2);const r=await api("getCourse",{id});if(r.status!=="approved")return location.hash="#/course/"+id;
 L={r,id,done:new Set(r.done),cur:null};
 app.innerHTML=`<div class="learn"><aside class="card side" style="padding:12px"><a class="m" href="#/course/${id}">← ${esc(r.course.title)}</a><div class="bar" style="margin:12px 4px"><i id="pb"></i></div><div id="ll"></div>${r.course.questionCount?`<div style="padding:8px 4px"><a class="btn p full" id="exb" href="#/exam/${id}">Take the exam</a></div>`:""}</aside><section id="lv"></section></div>`;
 lList();r.lessons.length?openLesson(r.lessons[0].id):$("#lv").innerHTML='<div class="card emp">No lessons yet.</div>'}
function lList(){const ls=L.r.lessons,p=ls.length?Math.round(L.done.size/ls.length*100):0;$("#pb").style.width=p+"%";
 $("#ll").innerHTML=ls.map(l=>`<button class="li ${L.cur===l.id?"on":""}" onclick="openLesson('${l.id}')"><span class="ck ${L.done.has(l.id)?"d":""}">${L.done.has(l.id)?"✓":""}</span>${esc(l.title)}</button>`).join("");const b=$("#exb");if(b)b.style.opacity=p>=100?1:.45}
async function openLesson(lid){L.cur=lid;lList();const v=$("#lv");v.innerHTML=sk(1);let m;
 try{m=(await api("getLesson",{lessonId:lid})).lesson}catch(e){const o=await idbGet(lid).catch(()=>null);if(!o){v.innerHTML=`<div class="card emp">${esc(e.message)}</div>`;return}m=o.meta;toast("Offline: playing your saved copy.")}
 L.m=m;v.innerHTML=`<h2>${esc(m.title)}</h2><div id="media"></div><div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap" class="noprint">${S.role==="student"?`<button class="btn p" id="dn" onclick="markDone('${lid}')">${L.done.has(lid)?"Completed ✓":"Mark as complete"}</button>`:""}<span id="offb"></span></div>`;
 const el=$("#media");
 if(m.type==="text")el.innerHTML=`<div class="card prose">${md(m.text)}</div>`;
 else if(m.type==="link"){const d=/\.(mp4|webm|ogg)(\?|$)/i.test(m.url),e=embed(m.url);el.innerHTML=d?`<div class="vw"><video src="${esc(m.url)}" controls controlsList="nodownload noremoteplayback" disablePictureInPicture oncontextmenu="return false"></video></div>`:e?`<div class="vw"><iframe src="${esc(e)}" allow="fullscreen;picture-in-picture" allowfullscreen></iframe></div>`:'<div class="card emp">This link cannot be embedded.</div>'}
 else fileView(m,el)}
const ringH=(p,l)=>`<div class="pcard" style="background:none;box-shadow:none;color:#fff"><div class="ring"><svg viewBox="0 0 36 36"><circle class="bg" cx="18" cy="18" r="15.9" style="stroke:#fff3"/><circle class="fg2" id="rg2" cx="18" cy="18" r="15.9" pathLength="100" stroke-dasharray="${p} 100" style="stroke:#7db4ff"/></svg><b id="pp2">${p}%</b></div><p id="pl2" style="color:#cbd5e1">${l}</p></div>`;
async function fileView(m,el){const saved=await idbGet(m.id).catch(()=>null);el.innerHTML=`<div class="vw" id="vwx">${ringH(0,"Preparing your lesson")}</div>`;
 try{const blob=saved?saved.blob:await fetchBlob(m,p=>{const g=$("#rg2");if(g){g.setAttribute("stroke-dasharray",p+" 100");$("#pp2").textContent=p+"%"}});if(L.m!==m)return;showMedia($("#vwx"),m,blob);
  $("#offb").innerHTML=saved?`<button class="btn" onclick="rmOff('${m.id}')">Remove offline copy</button>`:'<button class="btn" id="svb">Save for offline</button>';
  const sb=$("#svb");if(sb)sb.onclick=W("Saving offline copy",async()=>{await idbPut({id:m.id,meta:m,blob,title:m.title});toast("Saved for offline viewing in this app.");$("#offb").innerHTML=`<button class="btn" onclick="rmOff('${m.id}')">Remove offline copy</button>`})}
 catch(e){$("#vwx").innerHTML=`<div style="padding:20px">${esc(e.message||e)}</div>`}}
async function fetchBlob(m,onp){const parts=[];let start=0,total=m.size||1;while(start<total){const r=await api("mediaChunk",{lessonId:m.id,start},90000);total=r.total;parts.push(Uint8Array.from(atob(r.data),c=>c.charCodeAt(0)));start=r.end+1;onp(Math.round(start/total*100));if(r.done)break}return new Blob(parts,{type:m.mimeType||"application/octet-stream"})}
function showMedia(el,m,blob){const u=URL.createObjectURL(blob),t=m.mimeType||"";el.innerHTML=t.startsWith("video/")?`<video src="${u}" controls controlsList="nodownload noremoteplayback" disablePictureInPicture playsinline oncontextmenu="return false"></video>`:t.startsWith("image/")?`<img src="${u}" draggable="false" oncontextmenu="return false" alt="">`:t==="application/pdf"?`<iframe src="${u}#toolbar=0&navpanes=0"></iframe>`:'<div style="padding:20px">This file type cannot be shown here.</div>'}
const rmOff=W("Removing",async(b,id)=>{await idbDel(id);toast("Offline copy removed.");openLesson(id)});
const markDone=W("Saving progress",async(b,lid)=>{const r=await api("completeLesson",{lessonId:lid});L.done.add(lid);const d=$("#dn");if(d)d.textContent="Completed ✓";lList();const ls=L.r.lessons,i=ls.findIndex(x=>x.id===lid);
 if(r.progress>=100)toast(L.r.course.questionCount?"All lessons done. The exam is unlocked.":"Course complete. Your certificate is ready.");else if(ls[i+1])openLesson(ls[i+1].id)});
function embed(u){let m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);if(m)return"https://www.youtube-nocookie.com/embed/"+m[1]+"?rel=0&modestbranding=1";m=u.match(/vimeo\.com\/(?:video\/)?(\d+)/);if(m)return"https://player.vimeo.com/video/"+m[1];return/^https:\/\//.test(u)?u:""}
function md(t){return esc(t).split(/\n{2,}/).map(b=>/^#{1,3} /.test(b)?"<h3>"+b.replace(/^#+ /,"")+"</h3>":/^- /m.test(b)?"<ul>"+b.split("\n").map(l=>"<li>"+l.replace(/^- /,"")+"</li>").join("")+"</ul>":"<p>"+b.replace(/\n/g,"<br>")+"</p>").join("").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")}

/* timed exam: server enforces the deadline, the client auto-submits at zero */
let X={};
async function examView(id){if(!S)return authM("in");app.innerHTML=sk(1);const r=await api("getCourse",{id}),c=r.course;if(r.status!=="approved")return location.hash="#/course/"+id;window.CT=r.certificate;
 app.innerHTML=`<div class="card" style="max-width:680px;margin:auto"><a class="m" href="#/learn/${id}">← Back to lessons</a><h2>${esc(c.title)}: final exam</h2><p class="m">${c.questionCount} multiple-choice questions · ${c.examMinutes} minutes · pass mark ${c.passMark}%${c.maxAttempts?" · "+c.maxAttempts+" attempts":""}</p>
 <p>The timer starts when you begin. The exam closes and is marked automatically when time runs out.</p>${r.attempts.length?`<p class="m">Previous attempts: ${r.attempts.map(a=>a.percent+"%").join(", ")}</p>`:""}
 ${r.attempts.some(a=>a.passed)?`<span class="badge g">You passed</span> <button class="btn sm" onclick="viewCert(CT)">View certificate</button>`:`<button class="btn p" onclick="beginExam('${id}')">Start exam</button>`}</div>`}
const beginExam=W("Starting your exam",async(b,id)=>{const r=await api("startExam",{courseId:id});X={...r,id,off:r.serverNow-Date.now(),A:JSON.parse(sessionStorage.getItem("ans"+r.attemptId)||"null")||r.saved||{}};
 app.innerHTML=`<div style="max-width:720px;margin:auto"><div class="timer" id="tm"><span>Time left</span><span id="tt">--:--</span></div><div class="card">${X.questions.map((q,i)=>`<div class="q"><b>${i+1}. ${esc(q.text)}</b>${q.options.map((o,j)=>`<label><input type="radio" name="${q.id}" ${X.A[q.id]===j?"checked":""} onchange="X.A['${q.id}']=${j};sessionStorage.setItem('ans'+X.attemptId,JSON.stringify(X.A))"> ${esc(o)}</label>`).join("")}</div>`).join("")}
 <button class="btn p full" style="margin-top:16px" onclick="submitX(false)">Submit exam</button></div></div>`;clearInterval(X.iv);X.iv=setInterval(tick,500);tick();scrollTo(0,0)});
function tick(){const left=X.endsAt-(Date.now()+X.off),t=$("#tt");if(!t){clearInterval(X.iv);return}const s=Math.max(0,Math.ceil(left/1000));t.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");$("#tm").classList.toggle("low",s<=60);if(left<=0){clearInterval(X.iv);submitX(true)}}
const submitX=async auto=>{if(!auto&&!confirm("Submit your answers now?"))return;clearInterval(X.iv);await doSubmit(auto)};
const doSubmit=W("Marking your exam",async(b,auto)=>{const r=(await api("submitExam",{attemptId:X.attemptId,answers:X.A})).result;sessionStorage.removeItem("ans"+X.attemptId);
 app.innerHTML=`<div class="card" style="max-width:520px;margin:auto;text-align:center;padding:36px"><p class="m">${auto?"Time is up. Your exam was marked automatically.":"Exam marked."}</p><div style="font-size:60px;font-weight:800;letter-spacing:-3px;color:${r.passed?"var(--ok)":"var(--bad)"}">${r.percent}%</div><p>${r.passed?"You passed. Your certificate has been issued.":"You needed "+r.passMark+"% to pass."}</p>
 <div style="display:flex;gap:10px;justify-content:center"><a class="btn p" href="#/me">${r.passed?"See certificate":"My learning"}</a>${r.passed?"":`<a class="btn" href="#/exam/${X.id}">Try again</a>`}</div></div>`});

/* certificates */
function certHtml(c){const f=c.config||{},a=/^#[0-9a-f]{6}$/i.test(f.accent)?f.accent:"#1769e0";return`<div class="cert" style="--a:${a}"><div class="ci"><div class="ct">${esc(f.title)}</div><p style="margin-top:14px">${esc(f.intro)}</p><div class="cn">${esc(c.studentName)}</div><p>${esc(f.body)}</p><h3>${esc(c.courseTitle)}</h3>${c.percent!=null?`<p>Final score <b style="color:#14213d">${c.percent}%</b></p>`:""}<div class="cs"><div><b>${fmtD(c.date)}</b><span>Date issued</span></div><div><b>${esc(f.signer)}</b><span>${esc(f.signerTitle)}</span></div></div><small style="display:block;margin-top:20px">Certificate no. ${esc(c.number)}${f.footer?" · "+esc(f.footer):""}</small></div></div>`}
function viewCert(c){if(!c||!c.config)return toast("Certificate not available yet.");sheet(certHtml(c)+'<button class="btn p full noprint" style="margin-top:12px" onclick="print()">Print or save as PDF</button>',1)}

/* admin: every list is paged and lazy */

 const lt=(kind,render,o={})=>{$("#ab").innerHTML=`${o.head||""}${o.search?'<div class="srch"><input id="aq" placeholder="Search"></div>':""}<div id="al"></div>`;const run=()=>lazy($("#al"),p=>api("adminList",{kind,page:p,q:$("#aq")?$("#aq").value:"",st:o.st}),render);let d;if($("#aq"))$("#aq").oninput=()=>{clearTimeout(d);d=setTimeout(run,350)};run()};

const issueM=W("Loading",async()=>{const o=(await api("adminList",{kind:"opts"})).items;const s=sheet(`<h3>Issue certificate</h3><div class="fg"><label>Learner email</label><input id="ie"></div><div class="fg"><label>Course</label><select id="ic">${o.map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join("")}</select></div><div class="fg"><label>Score to show (%)</label><input id="ip" type="number" value="100"></div><button class="btn p full" id="ik">Issue</button>`);
 $("#ik").onclick=W("Issuing",async()=>{await api("issueCertificate",{email:$("#ie").value,courseId:$("#ic").value,percent:$("#ip").value});s.remove();admin("certs")})});
const adminM=()=>{const s=sheet(`<h3>Create administrator</h3><div class="fg"><label>Name</label><input id="an"></div><div class="fg"><label>Username</label><input id="au"></div><div class="fg"><label>Password (6+ characters)</label><input id="ap" type="password"></div><button class="btn p full" id="ak">Create</button>`);$("#ak").onclick=W("Creating",async()=>{await api("createAdmin",{name:$("#an").value,username:$("#au").value,password:$("#ap").value});s.remove();admin("admins")})};

/* course editor */
let E={};const val=i=>$("#"+i).value;
async function editor(id){if(!S||S.role!=="admin")return authM("in");
 if(id==="new")E={id,course:{status:"draft",level:"Beginner",passMark:50,examMinutes:30,maxAttempts:0,showScore:true,shuffle:false,price:0,certConfig:{title:"Certificate of Completion",intro:"This certificate is proudly presented to",body:"for successfully completing",signer:"",signerTitle:"",accent:"#1769e0",footer:""}},lessons:[],questions:[],tab:"details",qShow:20};
 else{app.innerHTML=sk(2);const keep=E.id===id?E.tab:"details",r=await api("getAdminCourse",{id});E={...r,id,tab:keep,qShow:20}}
 E.cats=LS("c_cats")||[];drawE()}
function drawE(){const nw=E.id==="new";app.innerHTML=`<a class="m" href="#/admin/courses">← All courses</a><h2>${nw?"New course":esc(E.course.title)}</h2><div class="tabs">${[["details","Details"],["content","Content"],["exam","Exam"],["cert","Certificate"]].map(([k,n])=>`<button class="tab ${E.tab===k?"on":""}" ${nw&&k!=="details"?"disabled style='opacity:.4'":""} onclick="E.tab='${k}';drawE()">${n}</button>`).join("")}</div><div id="ep"></div>`;({details:eDetails,content:eContent,exam:eExam,cert:eCert})[E.tab]()}
function eDetails(){const c=E.course;$("#ep").innerHTML=`<div class="card"><div class="fg"><label>Course title</label><input id="f_t" value="${esc(c.title)}"></div>
 <div class="fr"><div class="fg"><label>Category (pick or type a new one)</label><input id="f_c" list="cl" value="${esc(c.category)}"><datalist id="cl">${E.cats.map(x=>`<option value="${esc(x)}">`).join("")}</datalist></div><div class="fg"><label>Level</label><select id="f_l">${["Beginner","Intermediate","Advanced"].map(x=>`<option ${c.level===x?"selected":""}>${x}</option>`).join("")}</select></div></div>
 <div class="fr"><div class="fg"><label>Duration</label><input id="f_d" value="${esc(c.duration)}" placeholder="6 hours"></div><div class="fg"><label>Price in USD (0 = free, approved instantly)</label><input id="f_p" type="number" min="0" step="0.01" value="${c.price}"></div></div>
 <div class="fg"><label>Description</label><textarea id="f_x" rows="5">${esc(c.description)}</textarea></div>
 <div class="fr"><div class="fg"><label>Cover picture (upload)</label><input id="f_f" type="file" accept="image/*"></div><div class="fg"><label>or cover picture link</label><input id="f_i" value="${esc(c.image)}" placeholder="https://"></div></div>
 <div class="fg"><label>Status</label><select id="f_s"><option value="draft" ${c.status!=="published"?"selected":""}>Draft (hidden)</option><option value="published" ${c.status==="published"?"selected":""}>Published</option></select></div><button class="btn p" onclick="saveDetails()">${E.id==="new"?"Create course":"Save changes"}</button></div>`}
const saveDetails=W("Saving course",async b=>{const c={title:val("f_t"),category:val("f_c"),level:val("f_l"),duration:val("f_d"),price:Number(val("f_p")||0),description:val("f_x"),image:val("f_i"),status:val("f_s")};if(E.id!=="new")c.id=E.id;
 const r=await api("saveCourse",{course:c}),f=$("#f_f").files[0];b.set(25);if(f){const u=await upFile(r.id,f,true,b,25,90,"Uploading cover");await api("saveCourse",{course:{id:r.id,image:u.url}})}
 toast("Saved.");if(E.id==="new"){E.tab="content";location.hash="#/admin/course/"+r.id}else editor(E.id)});

function eContent(){const ls=E.lessons,ed=E.editing?ls.find(l=>l.id===E.editing):null,t=ed?ed.type:"video";
 $("#ep").innerHTML=`<div class="card"><h3>Lessons (${ls.length})</h3>${ls.map((l,i)=>`<div class="ls"><div class="ico">${TI[l.type]||"•"}</div><b style="flex:1;font-size:14px">${esc(l.title)}</b><button class="btn sm" ${i?"":"disabled"} onclick="mv(${i},-1)">↑</button><button class="btn sm" ${i<ls.length-1?"":"disabled"} onclick="mv(${i},1)">↓</button><button class="btn sm" onclick="E.editing='${l.id}';eContent()">Edit</button><button class="btn sm d" onclick="delL('${l.id}')">Delete</button></div>`).join("")||'<div class="emp">No lessons yet.</div>'}</div>
 <div class="card"><h3>${ed?"Edit lesson":"Add a lesson"}</h3><div class="fg"><label>Title</label><input id="l_t" value="${esc(ed?ed.title:"")}"></div><div class="fg"><label>Type</label><select id="l_y" ${ed?"disabled":""} onchange="lType()">${[["video","Video upload"],["link","Video link (YouTube, Vimeo or .mp4)"],["text","Written text"],["pdf","PDF / book"],["image","Picture"]].map(([k,n])=>`<option value="${k}" ${t===k?"selected":""}>${n}</option>`).join("")}</select></div>
 <div id="l_x"></div><div style="display:flex;gap:10px"><button class="btn p" onclick="saveL()">${ed?"Save lesson":"Add lesson"}</button>${ed?'<button class="btn" onclick="E.editing=null;eContent()">Cancel</button>':""}</div></div>
 <div class="card"><h3>Bulk add video links</h3><p class="m">One lesson per line: <code>Title | https://link</code>. Up to 500 lines, saved all-or-nothing.</p><textarea id="bl" rows="5" placeholder="Intro | https://youtu.be/xxxxxxxxxxx"></textarea><input id="blf" type="file" accept=".txt,.csv"><button class="btn p" style="margin-top:8px" onclick="bulkL()">Import lessons</button></div>`;lType();fileInto("blf","bl")}
function lType(){const t=val("l_y"),ed=E.editing?E.lessons.find(l=>l.id===E.editing):null;$("#l_x").innerHTML=t==="link"?`<div class="fg"><label>Video link</label><input id="l_u" value="${esc(ed?ed.url:"")}" placeholder="https://www.youtube.com/watch?v=..."></div>`:t==="text"?`<div class="fg"><label>Text (use "# Heading", "- list" and **bold**)</label><textarea id="l_b" rows="9">${esc(ed?ed.text:"")}</textarea></div>`
 :`<div class="fg"><label>${{video:"Video file",pdf:"PDF file",image:"Picture"}[t]}${ed&&ed.hasFile?" (leave empty to keep the current file)":""}</label><input id="l_f" type="file" accept="${{video:"video/*",pdf:"application/pdf",image:"image/*"}[t]}"></div><p class="m">Files stay private. Only approved learners can view them and nothing is offered as a download.</p>`}
const saveL=W("Saving lesson",async b=>{const t=val("l_y"),ed=E.editing?E.lessons.find(l=>l.id===E.editing):null,l={id:ed&&ed.id,courseId:E.id,title:val("l_t"),type:t,url:$("#l_u")?val("l_u"):"",text:$("#l_b")?val("l_b"):""};
 if(t==="link"&&!/^https:\/\//.test(l.url))throw"Enter a link starting with https://";if(t==="text"&&!l.text.trim())throw"Write the lesson text.";const f=$("#l_f")&&$("#l_f").files[0];if(!ed&&["video","pdf","image"].includes(t)&&!f)throw"Choose a file to upload.";
 if(f){const u=await upFile(E.id,f,false,b,0,92,"Uploading "+f.name.slice(0,24));Object.assign(l,{fileId:u.fileId,mimeType:u.mimeType,size:u.size})}await api("saveLesson",{lesson:l});toast("Lesson saved.");E.editing=null;editor(E.id)});
const delL=id=>confirm("Delete this lesson and its file?")&&W("Deleting",async()=>{await api("deleteLesson",{id});editor(E.id)})();
const mv=W("Reordering",async(b,i,d)=>{const a=E.lessons;[a[i],a[i+d]]=[a[i+d],a[i]];await api("reorderLessons",{ids:a.map(x=>x.id)});eContent()});
function fileInto(fid,tid){const f=$("#"+fid);if(f)f.onchange=()=>{const r=new FileReader;r.onload=()=>{$("#"+tid).value=r.result};r.readAsText(f.files[0])}}
const bulkL=W("Importing lessons",async b=>{const items=val("bl").split(/\r?\n/).map(s=>s.trim()).filter(Boolean).map((l,i)=>{const p=l.split(/\s*[|\t]\s*/);if(p.length<2)throw`Line ${i+1}: use Title | https://link`;return{title:p[0],url:p[1],type:"link"}});
 if(items.length>500)throw"At most 500 lines per batch.";b.set(30);const r=await api("bulkAdd",{courseId:E.id,kind:"lessons",items});toast(r.added+" lessons added.");editor(E.id)});

function eExam(){const c=E.course,q=E.qEdit?E.questions.find(x=>x.id===E.qEdit):null;E.opts=q?q.options.slice():["","","",""];E.ans=q?q.answer:0;
 $("#ep").innerHTML=`<div class="card"><h3>Exam settings</h3><div class="fr"><div class="fg"><label>Pass mark (%)</label><input id="e_p" type="number" min="1" max="100" value="${c.passMark}"></div><div class="fg"><label>Time limit (minutes)</label><input id="e_m" type="number" min="1" value="${c.examMinutes}"></div></div>
 <div class="fr"><div class="fg"><label>Attempts allowed (0 = unlimited)</label><input id="e_a" type="number" min="0" value="${c.maxAttempts}"></div><div class="fg"><label>Question order</label><select id="e_s"><option value="0" ${c.shuffle?"":"selected"}>Fixed</option><option value="1" ${c.shuffle?"selected":""}>Shuffled each attempt</option></select></div></div>
 <p class="m">Learners at or above the pass mark receive a certificate automatically.</p><button class="btn p" onclick="saveCfg()">Save settings</button></div>
 <div class="card"><h3>Questions (${E.questions.length})</h3>${E.questions.slice(0,E.qShow).map((x,i)=>`<div class="ls"><div style="flex:1;font-size:14px"><b>${i+1}. ${esc(x.text)}</b><div class="m">Answer: ${esc(x.options[x.answer])} · ${x.points} pt</div></div><button class="btn sm" onclick="E.qEdit='${x.id}';eExam();scrollTo(0,document.body.scrollHeight)">Edit</button><button class="btn sm d" onclick="delQ('${x.id}')">Delete</button></div>`).join("")||'<div class="emp">No questions yet. Without questions, finishing the lessons earns the certificate.</div>'}
 ${E.questions.length>E.qShow?`<button class="btn full" onclick="E.qShow+=20;eExam()">Show more</button>`:""}</div>
 <div class="card"><h3>${q?"Edit question":"Add a question"}</h3><div class="fg"><label>Question</label><textarea id="q_t" rows="2">${esc(q?q.text:"")}</textarea></div><div class="fg"><label>Options (select the correct one)</label><div id="q_o"></div><button class="btn sm" onclick="if(E.opts.length<6){E.opts.push('');drawO()}">+ Option</button></div>
 <div class="fg" style="max-width:150px"><label>Points</label><input id="q_pt" type="number" min="1" value="${q?q.points:1}"></div><div style="display:flex;gap:10px"><button class="btn p" onclick="saveQ()">${q?"Save question":"Add question"}</button>${q?'<button class="btn" onclick="E.qEdit=null;eExam()">Cancel</button>':""}</div></div>
 <div class="card"><h3>Bulk import questions</h3><p class="m">One per line: <code>Question | Option A | Option B | Option C | Option D | B</code>. Last field is the correct letter (add <code>:2</code> for 2 points, e.g. <code>B:2</code>). Up to 500 lines, saved all-or-nothing. You can paste from Excel or load a .txt or .csv file.</p><textarea id="bq" rows="6"></textarea><input id="bqf" type="file" accept=".txt,.csv"><button class="btn p" style="margin-top:8px" onclick="bulkQ()">Import questions</button></div>`;drawO();fileInto("bqf","bq")}
function drawO(){$("#q_o").innerHTML=E.opts.map((o,i)=>`<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><input type="radio" name="ca" ${E.ans===i?"checked":""} onchange="E.ans=${i}"><input value="${esc(o)}" oninput="E.opts[${i}]=this.value" placeholder="Option ${i+1}" style="margin:0">${E.opts.length>2?`<button class="btn sm d" onclick="E.opts.splice(${i},1);if(E.ans>=E.opts.length)E.ans=0;drawO()">×</button>`:""}</div>`).join("")}
const saveCfg=W("Saving settings",async()=>{await api("saveCourse",{course:{id:E.id,passMark:Number(val("e_p")),examMinutes:Number(val("e_m")),maxAttempts:Number(val("e_a")),shuffle:val("e_s")==="1"}});toast("Exam settings saved.");editor(E.id)});
const saveQ=W("Saving question",async()=>{const idx=E.opts.map((o,i)=>[o.trim(),i]).filter(x=>x[0]);await api("saveQuestion",{question:{id:E.qEdit,courseId:E.id,text:val("q_t"),options:idx.map(x=>x[0]),answer:idx.findIndex(x=>x[1]===E.ans),points:Number(val("q_pt")||1)}});toast("Question saved.");E.qEdit=null;editor(E.id)});
const delQ=id=>W("Deleting",async()=>{await api("deleteQuestion",{id});editor(E.id)})();
const bulkQ=W("Importing questions",async b=>{const items=val("bq").split(/\r?\n/).map(s=>s.trim()).filter(Boolean).map((l,i)=>{const p=l.split(/\s*[|\t]\s*/);if(p.length<4)throw`Line ${i+1}: use Question | Option | Option | ... | Answer`;const a=p.pop(),m=/^([A-Fa-f]|\d)(?::(\d+))?$/.exec(a);if(!m)throw`Line ${i+1}: the last field must be the answer, like B or B:2`;return{text:p[0],options:p.slice(1),answer:/\d/.test(m[1])?+m[1]-1:"ABCDEF".indexOf(m[1].toUpperCase()),points:+(m[2]||1)}});
 if(items.length>500)throw"At most 500 lines per batch.";b.set(30,"Saving "+items.length+" questions");const r=await api("bulkAdd",{courseId:E.id,kind:"questions",items});toast(r.added+" questions added.");editor(E.id)});

function eCert(){const c=E.course,f=c.certConfig,fl=(k,l)=>`<div class="fg"><label>${l}</label><input id="c_${k}" value="${esc(f[k])}" oninput="certPrev()"></div>`;
 $("#ep").innerHTML=`<div class="card"><p class="m">Changes apply to every certificate for this course, including ones already issued.</p>${fl("title","Heading")}${fl("intro","Line above the learner's name")}${fl("body","Line above the course name")}<div class="fr">${fl("signer","Signatory name")}${fl("signerTitle","Signatory title")}</div>
 <div class="fr">${fl("footer","Footer note (optional)")}<div class="fg"><label>Accent colour</label><input id="c_accent" type="color" value="${esc(f.accent)}" oninput="certPrev()" style="height:44px;padding:4px"></div></div>
 <label style="display:flex;gap:8px;align-items:center;margin-bottom:10px"><input type="checkbox" id="c_show" ${c.showScore?"checked":""} onchange="certPrev()"> Show the learner's percentage on the certificate</label><p class="m">Pass mark is ${c.passMark}% (change it on the Exam tab).</p><button class="btn p" onclick="saveCert()">Save certificate</button></div><div class="card"><div class="m" style="margin-bottom:8px">Preview</div><div id="cprev"></div></div>`;certPrev()}
const certCfg=()=>Object.fromEntries(["title","intro","body","signer","signerTitle","footer","accent"].map(k=>[k,val("c_"+k)]));
const certPrev=()=>{$("#cprev").innerHTML=certHtml({studentName:"Student Name",courseTitle:E.course.title||"Course title",number:"LUX-0000-2026-0000",date:Date.now(),percent:$("#c_show").checked?85:null,config:certCfg()})};
const saveCert=W("Saving certificate",async()=>{await api("saveCourse",{course:{id:E.id,certConfig:certCfg(),showScore:$("#c_show").checked}});toast("Certificate saved.");editor(E.id)});

nav();route();
</script></body></html>
