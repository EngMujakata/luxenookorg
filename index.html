<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e1a2b">
<title>Luxenook Online Courses</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./logo-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f6;--card:#fff;--ink:#0e1a2b;--mut:#64748b;--line:#e1e8ea;--ac:#0f766e;--ac2:#115e59;--soft:#e3f3f1;--amb:#f59e0b;--bad:#dc2626;--ok:#059669;--r:14px;--sh:0 1px 2px rgba(14,26,43,.05),0 8px 24px rgba(14,26,43,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#09111c;--card:#111c2b;--ink:#e7eef7;--mut:#93a3b8;--line:#1f2d41;--soft:#12332f;--sh:none}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.hdr{position:sticky;top:0;z-index:50;height:64px;display:flex;align-items:center;gap:20px;padding:0 max(18px,4vw);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.4px}.brand img{width:34px;height:34px;border-radius:9px}
.brand i{font-style:normal;color:var(--ac)}.sp{flex:1}
.nav{display:flex;gap:6px;align-items:center}
.btn{border:1px solid transparent;border-radius:10px;padding:9px 16px;font-weight:700;font-size:14px;background:var(--ink);color:var(--bg);transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.5;pointer-events:none}
.btn.p{background:var(--ac);color:#fff}.btn.p:hover{background:var(--ac2)}
.btn.o{background:transparent;border-color:var(--line);color:var(--ink)}.btn.s{background:var(--soft);color:var(--ac)}.btn.d{background:transparent;color:var(--bad);border-color:var(--line)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}
.wrap{max-width:1180px;margin:auto;padding:28px max(18px,4vw)}
.hero{padding:56px 0 30px}.hero h1{font-size:clamp(34px,5.4vw,60px);line-height:1.04;letter-spacing:-2px;max-width:760px}
.hero p{color:var(--mut);font-size:18px;max-width:560px;margin:16px 0 26px}
.search{display:flex;max-width:600px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:var(--sh)}
.search input{flex:1;border:0;background:none;outline:0;padding:0 14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:26px 0 20px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 15px;font-size:13px;font-weight:700;color:var(--mut)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:20px}
.cc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.cc:hover{transform:translateY(-3px);box-shadow:var(--sh)}
.cc .im{aspect-ratio:16/10;background:var(--soft) center/cover;position:relative}
.cc .im b{position:absolute;left:10px;bottom:10px;background:var(--card);border-radius:7px;padding:3px 9px;font-size:12px}
.cc .bd{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}.cc h3{font-size:17px;line-height:1.25;letter-spacing:-.3px}
.cc p{font-size:13px;color:var(--mut)}.meta{display:flex;gap:12px;font-size:12px;color:var(--mut);margin-top:auto;padding-top:8px;flex-wrap:wrap}
.sk{background:linear-gradient(90deg,var(--line),var(--soft),var(--line));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:var(--r);height:300px}@keyframes sk{to{background-position:-200% 0}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:18px}
h2{font-size:24px;letter-spacing:-.6px}h3{letter-spacing:-.3px}.mut{color:var(--mut);font-size:13px}
.cd{display:grid;grid-template-columns:1.3fr .7fr;gap:30px;align-items:start}
.cd .im{aspect-ratio:16/10;border-radius:var(--r);background:var(--soft) center/cover}
.cd h1{font-size:clamp(28px,4vw,42px);letter-spacing:-1.4px;line-height:1.08;margin:8px 0 12px}
.badge{display:inline-block;border-radius:99px;padding:3px 10px;font-size:11px;font-weight:800;background:var(--soft);color:var(--ac)}
.badge.w{background:#fef3c7;color:#92400e}.badge.r{background:#fee2e2;color:#991b1b}.badge.g{background:#d1fae5;color:#065f46}
.ls{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}.ls:last-child{border:0}
.ico{width:34px;height:34px;border-radius:9px;background:var(--soft);color:var(--ac);display:grid;place-items:center;font-size:14px;flex:none}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.learn{display:grid;grid-template-columns:310px 1fr;gap:20px;align-items:start}
.side{position:sticky;top:80px;max-height:calc(100vh - 100px);overflow:auto}
.li{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:10px;font-size:14px;font-weight:600}
.li:hover,.li.on{background:var(--soft)}.li .ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:11px;color:#fff}
.li .ck.d{background:var(--ok);border-color:var(--ok)}
.vw{aspect-ratio:16/9;background:#000;border-radius:var(--r);overflow:hidden;display:grid;place-items:center;color:#cbd5e1;text-align:center}
.vw video,.vw iframe,.vw img{width:100%;height:100%;border:0;object-fit:contain;-webkit-user-select:none;user-select:none}
.prose{max-width:70ch}.prose p,.prose ul{margin:0 0 14px}.prose h3{margin:20px 0 8px}.prose ul{padding-left:20px}
.in{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;outline:0}.in:focus{border-color:var(--ac)}
.fg{margin-bottom:14px}.fg label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:var(--mut)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px}
.st div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}.st b{display:block;font-size:26px;letter-spacing:-.8px}.st span{font-size:12px;color:var(--mut)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tab{background:none;border:0;padding:11px 15px;font-weight:700;font-size:14px;color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap}.tab.on{color:var(--ac);border-color:var(--ac)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--mut);font-size:12px;padding:10px;border-bottom:1px solid var(--line)}td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.ov{position:fixed;inset:0;background:rgba(6,12,22,.62);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;z-index:100;overflow:auto}
.box{background:var(--card);border-radius:18px;width:min(520px,100%);padding:26px;position:relative;max-height:94vh;overflow:auto}.box.l{width:min(860px,100%)}
.x{position:absolute;right:14px;top:14px;border:0;background:var(--soft);border-radius:50%;width:30px;height:30px;font-size:17px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,90px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:11px;font-size:14px;z-index:300;transition:.25s;max-width:92vw}.toast.on{transform:translate(-50%,0)}
.empty{padding:34px;text-align:center;color:var(--mut)}
.q{padding:18px 0;border-bottom:1px solid var(--line)}.q label{display:flex;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;margin-top:8px;cursor:pointer}.q label:has(input:checked){border-color:var(--ac);background:var(--soft)}
.timer{position:sticky;top:64px;z-index:20;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:800}
.timer.low{color:var(--bad);border-color:var(--bad)}
.cert{background:#fff;color:#14213d;border:10px solid var(--a);padding:14px;text-align:center}
.cert .ci{border:1px solid #cbd5e1;padding:34px 18px}.cert .ct{font-size:30px;font-weight:800;color:var(--a);letter-spacing:-.8px}.cert .cn{font-size:30px;font-weight:800;margin:14px 0;border-bottom:2px solid var(--a);display:inline-block;padding:0 24px}
.cert p{color:#64748b}.cert h3{font-size:22px;margin:8px 0}.cert .cs{display:flex;justify-content:space-around;gap:20px;margin-top:30px}.cert .cs div{flex:1;border-top:1px solid #94a3b8;padding-top:6px}.cert .cs b{display:block}.cert .cs span,.cert small{font-size:11px;color:#64748b}
footer{padding:30px;text-align:center;color:var(--mut);font-size:12px}
@media(max-width:820px){.cd,.learn{grid-template-columns:1fr}.side{position:static;max-height:none}.fr{grid-template-columns:1fr}.nav .hide{display:none}.hero{padding-top:30px}}
@media print{.hdr,#app,.toast,footer,.noprint{display:none!important}.ov{position:static;background:none;padding:0}.box{box-shadow:none;padding:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="hdr">
  <a class="brand" href="#/"><img src="./logo-192.png" alt="" onerror="this.remove()">Luxe<i>nook</i></a>
  <div class="sp"></div><nav class="nav" id="nav"></nav>
</header>
<main id="app"></main>
<footer>© 2026 Luxenook Online Courses · Powered by Electrify Technologies</footer>
<div class="toast" id="toast" role="status"></div>
<div id="mroot"></div>

<script>
const API="https://script.google.com/macros/s/AKfycbyAJdtiCt3X3E6AUYUHB_40s-8sM2oZ9Mv6G6wze-uuAkddupGLA8YJ851fErLjwxxr/exec";
const $=(s,r=document)=>r.querySelector(s), app=$("#app");
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtD=t=>new Date(Number(t)).toLocaleDateString(undefined,{day:"numeric",month:"long",year:"numeric"});
const money=n=>Number(n)?"$"+Number(n).toFixed(2):"Free";
const cvr=u=>u?`style="background-image:url('${esc(u)}')"`:"";
let S=JSON.parse(localStorage.getItem("lx")||"null"), IO=null;

/* ---------- core ---------- */
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),4200)}
async function api(action,d={}){
  const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,token:S&&S.token,...d})});
  let j;try{j=await r.json()}catch(e){throw new Error("Server returned an invalid response. Try again.")}
  if(!j.success){if(j.message==="SESSION_EXPIRED"){signOut(true);throw new Error("Your session expired. Please sign in again.")}throw new Error(j.message||"Request failed.")}
  return j}
async function apiR(a,d,n=3){let e;for(let i=0;i<n;i++){try{return await api(a,d)}catch(x){e=x;if(/expired|sign in/i.test(x.message))throw x;await new Promise(r=>setTimeout(r,500*2**i))}}throw e}
async function run(fn,btn){if(btn)btn.disabled=true;try{return await fn()}catch(e){toast(e.message)}finally{if(btn)btn.disabled=false}}
function openM(html,large){closeM();$("#mroot").innerHTML=`<div class="ov" onmousedown="if(event.target===this)closeM()"><div class="box ${large?"l":""}"><button class="x noprint" onclick="closeM()" aria-label="Close">×</button>${html}</div></div>`}
function closeM(){$("#mroot").innerHTML=""}
function go(h){location.hash=h}
function skel(n=6){return `<div class="grid">${"<div class=sk></div>".repeat(n)}</div>`}

/* ---------- offline store (IndexedDB) ---------- */
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open("luxenook",1);r.onupgradeneeded=()=>r.result.createObjectStore("media",{keyPath:"id"});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
async function idbOp(mode,fn){const db=await idb();return new Promise((ok,no)=>{const t=db.transaction("media",mode),q=fn(t.objectStore("media"));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error)})}
const idbGet=id=>idbOp("readonly",s=>s.get(id)),idbAll=()=>idbOp("readonly",s=>s.getAll()),idbPut=o=>idbOp("readwrite",s=>s.put(o)),idbDel=id=>idbOp("readwrite",s=>s.delete(id)),idbClear=()=>idbOp("readwrite",s=>s.clear());

/* ---------- header / auth ---------- */
function nav(){
  $("#nav").innerHTML=!S?`<button class="btn o" onclick="authM('in')">Sign in</button><button class="btn p" onclick="authM('up')">Create account</button>`
   :`<a class="btn o" href="#/${S.role==="admin"?"admin":"me"}">${S.role==="admin"?"Admin":"My learning"}</a><button class="btn o hide" onclick="signOut()">Sign out</button>`}
function authM(mode){
  openM(mode==="up"?`<h2>Create your account</h2><p class="mut" style="margin:4px 0 18px">Browse for free. Create an account to request a course.</p>
   <div class="fr"><div class="fg"><label>First name</label><input class="in" id="fn"></div><div class="fg"><label>Last name</label><input class="in" id="ln"></div></div>
   <div class="fg"><label>Email</label><input class="in" id="em" type="email"></div><div class="fg"><label>Username</label><input class="in" id="un"></div>
   <div class="fg"><label>Password (6+ characters)</label><input class="in" id="pw" type="password"></div>
   <button class="btn p" style="width:100%" onclick="doSignup(this)">Create account</button><p class="mut" style="text-align:center;margin-top:14px">Have an account? <a href="#" onclick="authM('in');return false" style="color:var(--ac);font-weight:700">Sign in</a></p>`
  :`<h2>Welcome back</h2><p class="mut" style="margin:4px 0 18px">Sign in to continue.</p>
   <div class="fg"><label>Account type</label><select class="in" id="rl"><option value="student">Student</option><option value="admin">Administrator</option></select></div>
   <div class="fg"><label>Username or email</label><input class="in" id="un" autocomplete="username"></div>
   <div class="fg"><label>Password</label><input class="in" id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin(this.closest('.box').querySelector('.btn.p'))"></div>
   <button class="btn p" style="width:100%" onclick="doLogin(this)">Sign in</button><p class="mut" style="text-align:center;margin-top:14px">New here? <a href="#" onclick="authM('up');return false" style="color:var(--ac);font-weight:700">Create an account</a></p>`)}
function setSession(s){S=s;localStorage.setItem("lx",JSON.stringify(s));closeM();nav();route()}
const doSignup=b=>run(async()=>{const v=i=>$("#"+i).value.trim();const r=await api("signup",{firstName:v("fn"),lastName:v("ln"),email:v("em"),username:v("un"),password:$("#pw").value});setSession(r.session);toast("Account created.")},b);
const doLogin=b=>run(async()=>{const r=await api("login",{role:$("#rl").value,username:$("#un").value,password:$("#pw").value});setSession(r.session);go(r.session.role==="admin"?"#/admin":"#/me")},b);
function signOut(silent){S=null;localStorage.removeItem("lx");idbClear().catch(()=>{});nav();if(!silent)toast("Signed out.");go("#/");route()}

/* ---------- router ---------- */
function route(){
  if(IO){IO.disconnect();IO=null}closeM();window.scrollTo(0,0);
  const p=(location.hash.slice(2)||"").split("/");
  const v={"":home,course:()=>courseView(p[1]),learn:()=>learn(p[1]),exam:()=>examView(p[1]),me:dash,admin:()=>p[1]==="course"?editor(p[2]):admin(p[1]||"overview")}[p[0]];
  Promise.resolve(v?v():home()).catch(e=>{app.innerHTML=`<div class="wrap"><div class="card empty">${esc(e.message)}<br><br><a class="btn p" href="#/">Back to courses</a></div></div>`});
}
window.addEventListener("hashchange",route);

/* ---------- home (lazy, 10 at a time) ---------- */
let H={};
async function home(){
  H={off:0,q:"",cat:"",busy:false,more:true,id:0};
  app.innerHTML=`<div class="wrap"><section class="hero"><h1>Learn something worth a certificate.</h1><p>Short, structured courses with video, reading and a timed exam at the end. Browse freely, sign in when you're ready to learn.</p>
   <div class="search"><input id="q" placeholder="Search courses" onkeydown="if(event.key==='Enter')hFilter()"><button class="btn p" onclick="hFilter()">Search</button></div></section>
   <div class="chips" id="chips"></div><div class="grid" id="grid"></div><div id="sent" style="height:2px"></div></div>`;
  api("getCategories").then(r=>{$("#chips").innerHTML=["All",...r.categories].map(c=>`<button class="chip ${c==="All"?"on":""}" onclick="hCat(this,'${esc(c).replace(/'/g,"\\'")}')">${esc(c)}</button>`).join("")}).catch(()=>{});
  IO=new IntersectionObserver(e=>{if(e[0].isIntersecting)loadMore()},{rootMargin:"500px"});IO.observe($("#sent"));loadMore();
}
function hFilter(){H={...H,off:0,q:$("#q").value.trim(),more:true,busy:false,id:H.id+1};$("#grid").innerHTML="";loadMore()}
function hCat(b,c){document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));b.classList.add("on");H={...H,cat:c==="All"?"":c,off:0,more:true,busy:false,id:H.id+1};$("#grid").innerHTML="";loadMore()}
async function loadMore(){
  if(H.busy||!H.more)return;H.busy=true;const my=H.id,g=$("#grid");if(!g)return;
  const s=document.createElement("div");s.className="sk";g.append(s);
  try{const r=await api("getCourses",{offset:H.off,limit:10,q:H.q,category:H.cat});if(my!==H.id)return;s.remove();
    g.insertAdjacentHTML("beforeend",r.courses.map(c=>`<article class="cc" onclick="go('#/course/${c.id}')"><div class="im" ${cvr(c.image)}><b>${money(c.price)}</b></div>
     <div class="bd"><span class="mut">${esc(c.category)}</span><h3>${esc(c.title)}</h3><p>${esc(c.summary)}</p><div class="meta"><span>${c.lessons} lessons</span><span>${esc(c.duration)}</span><span>${esc(c.level)}</span></div></div></article>`).join(""));
    H.off+=r.courses.length;H.more=r.hasMore;if(!g.children.length)g.innerHTML=`<div class="card empty" style="grid-column:1/-1">No courses match your search.</div>`;
  }catch(e){if(my===H.id){s.remove();toast(e.message)}}finally{if(my===H.id)H.busy=false}
}

/* ---------- course page ---------- */
const TI={video:"▶",link:"▶",text:"≡",pdf:"▤",image:"▧"};
async function courseView(id){
  app.innerHTML=`<div class="wrap">${skel(1)}</div>`;
  const r=await api("getCourse",{id}),c=r.course;
  const cta={none:`<button class="btn p" onclick="reqAccess('${c.id}')">${Number(c.price)?"Request access":"Start for free"}</button>`,
   pending:`<span class="badge w">Awaiting admin approval</span><p class="mut" style="margin-top:8px">You can start as soon as your payment is confirmed.</p>`,
   approved:`<a class="btn p" href="#/learn/${c.id}">${S&&S.role==="admin"?"Preview course":"Continue learning"}</a>`,
   rejected:`<span class="badge r">Access not granted</span><br><br><button class="btn o" onclick="reqAccess('${c.id}')">Request again</button>`}[r.status];
  app.innerHTML=`<div class="wrap"><div class="cd"><div><span class="badge">${esc(c.category)}</span><h1>${esc(c.title)}</h1><p style="color:var(--mut);white-space:pre-line">${esc(c.description)}</p>
   <div class="meta" style="margin:18px 0"><span>${c.lessons} lessons</span><span>${esc(c.duration)}</span><span>${esc(c.level)}</span>${c.questionCount?`<span>Exam: ${c.questionCount} questions${c.examMinutes?`, ${c.examMinutes} min`:""}, pass at ${c.passMark}%</span>`:""}</div>
   <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><b style="font-size:24px">${money(c.price)}</b><div>${cta}</div></div>
   ${r.certificate?`<p style="margin-top:14px"><button class="btn s" onclick='viewCert(${JSON.stringify(r.certificate).replace(/'/g,"&#39;")})'>View your certificate</button></p>`:""}</div>
   <div class="im" ${cvr(c.image)}></div></div>
   <div class="card" style="margin-top:30px"><h3 style="margin-bottom:6px">What's inside</h3><p class="mut" style="margin-bottom:8px">Lessons unlock after your access is approved.</p>
   ${r.lessons.map(l=>`<div class="ls"><div class="ico">${TI[l.type]||"•"}</div><b style="font-size:14px">${esc(l.title)}</b>${r.done.includes(l.id)?`<span class="badge g" style="margin-left:auto">Done</span>`:""}</div>`).join("")||`<div class="empty">Lessons are coming soon.</div>`}</div></div>`;
}
const reqAccess=id=>{if(!S)return authM("up");if(S.role!=="student")return toast("Use a student account to request access.");run(async()=>{const r=await api("requestAccess",{courseId:id});toast(r.status==="approved"?"You're in. Enjoy the course.":"Request sent. The administrator will approve it once payment is confirmed.");courseView(id)})};

/* ---------- learning player ---------- */
let L={};
async function learn(id){
  if(!S)return authM("in");
  const r=await api("getCourse",{id});if(r.status!=="approved")return go("#/course/"+id);
  L={r,id,done:new Set(r.done),cur:null};
  app.innerHTML=`<div class="wrap"><div class="learn"><aside class="card side" style="padding:14px"><a class="mut" href="#/course/${id}">← ${esc(r.course.title)}</a>
   <div class="bar" style="margin:12px 4px"><i id="pb"></i></div><div id="ll"></div>
   ${r.course.questionCount?`<div style="padding:10px 4px"><a class="btn p" style="width:100%;text-align:center" id="exb" href="#/exam/${id}">Take the exam</a></div>`:""}</aside><section id="lv"></section></div></div>`;
  lList();if(r.lessons.length)openLesson(r.lessons[0].id);else $("#lv").innerHTML=`<div class="card empty">No lessons yet.</div>`;
}
function lList(){
  const ls=L.r.lessons,p=ls.length?Math.round(L.done.size/ls.length*100):0;$("#pb").style.width=p+"%";
  $("#ll").innerHTML=ls.map(l=>`<button class="li ${L.cur===l.id?"on":""}" onclick="openLesson('${l.id}')"><span class="ck ${L.done.has(l.id)?"d":""}">${L.done.has(l.id)?"✓":""}</span>${esc(l.title)}</button>`).join("");
  const b=$("#exb");if(b){b.style.opacity=p>=100?1:.45;b.title=p>=100?"":"Complete every lesson first"}
}
async function openLesson(lid){
  L.cur=lid;lList();const v=$("#lv");v.innerHTML=skel(1);let m;
  try{m=(await api("getLesson",{lessonId:lid})).lesson}catch(e){const o=await idbGet(lid).catch(()=>null);if(!o){v.innerHTML=`<div class="card empty">${esc(e.message)}</div>`;return}m=o.meta;toast("Offline: playing your saved copy.")}
  L.m=m;const canDone=S.role==="student";
  v.innerHTML=`<h2 style="margin-bottom:14px">${esc(m.title)}</h2><div id="media"></div>
   <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap" class="noprint">${canDone?`<button class="btn p" id="dn" onclick="markDone('${lid}',this)">${L.done.has(lid)?"Completed ✓":"Mark as complete"}</button>`:""}<span id="offb"></span></div>`;
  const el=$("#media");
  if(m.type==="text")el.innerHTML=`<div class="card prose">${md(m.text)}</div>`;
  else if(m.type==="link"){const d=/\.(mp4|webm|ogg)(\?|$)/i.test(m.url);const e=embed(m.url);el.innerHTML=d?`<div class="vw"><video src="${esc(m.url)}" controls controlsList="nodownload noremoteplayback" disablePictureInPicture oncontextmenu="return false"></video></div>`:e?`<div class="vw"><iframe src="${esc(e)}" allow="fullscreen; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`:`<div class="card empty">This link can't be embedded.</div>`}
  else if(m.hasFile||m.type==="video"||m.type==="pdf"||m.type==="image")fileView(m,el);
}
async function fileView(m,el){
  const saved=await idbGet(m.id).catch(()=>null);
  el.innerHTML=`<div class="vw" id="vwx"><div style="padding:20px"><div id="pt">Preparing your lesson…</div><div class="bar" style="width:240px;margin:12px auto"><i id="pp" style="width:0"></i></div></div></div>`;
  try{
    const blob=saved?saved.blob:await fetchBlob(m,p=>{const b=$("#pp");if(b)b.style.width=p+"%"});
    if(L.m!==m)return;showMedia($("#vwx"),m,blob);
    $("#offb").innerHTML=saved?`<button class="btn o" onclick="rmOff('${m.id}')">Remove offline copy</button>`:`<button class="btn o" id="svb">Save for offline</button>`;
    const sb=$("#svb");if(sb)sb.onclick=()=>run(async()=>{await idbPut({id:m.id,meta:m,blob,title:m.title,at:Date.now()});toast("Saved for offline viewing in this app.");$("#offb").innerHTML=`<button class="btn o" onclick="rmOff('${m.id}')">Remove offline copy</button>`},sb);
  }catch(e){$("#vwx").innerHTML=`<div style="padding:20px">${esc(e.message)}</div>`}
}
async function fetchBlob(m,onp){
  const parts=[];let start=0,total=m.size||1;
  while(start<total){const r=await apiR("mediaChunk",{lessonId:m.id,start});total=r.total;parts.push(Uint8Array.from(atob(r.data),c=>c.charCodeAt(0)));start=r.end+1;onp(Math.round(start/total*100));if(r.done)break}
  return new Blob(parts,{type:m.mimeType||"application/octet-stream"})}
function showMedia(el,m,blob){
  const u=URL.createObjectURL(blob),t=m.mimeType||"";
  el.innerHTML=t.startsWith("video/")?`<video src="${u}" controls controlsList="nodownload noremoteplayback" disablePictureInPicture playsinline oncontextmenu="return false"></video>`
   :t.startsWith("image/")?`<img src="${u}" draggable="false" oncontextmenu="return false" alt="${esc(m.title)}">`
   :t==="application/pdf"?`<iframe src="${u}#toolbar=0&navpanes=0"></iframe>`:`<div style="padding:20px">This file type can't be shown in the browser. Ask your instructor for a PDF or video version.</div>`}
const rmOff=id=>run(async()=>{await idbDel(id);toast("Offline copy removed.");openLesson(id)});
const markDone=(lid,b)=>run(async()=>{const r=await api("completeLesson",{lessonId:lid});L.done.add(lid);b.textContent="Completed ✓";lList();
  const ls=L.r.lessons,i=ls.findIndex(x=>x.id===lid);if(r.progress>=100){toast(L.r.course.questionCount?"All lessons done. The exam is unlocked.":"Course complete. Your certificate is ready.")}else if(ls[i+1])openLesson(ls[i+1].id)},b);
function embed(u){let m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);if(m)return"https://www.youtube-nocookie.com/embed/"+m[1]+"?rel=0&modestbranding=1";m=u.match(/vimeo\.com\/(?:video\/)?(\d+)/);if(m)return"https://player.vimeo.com/video/"+m[1];return/^https:\/\//.test(u)?u:""}
function md(t){return esc(t).split(/\n{2,}/).map(b=>/^#{1,3} /.test(b)?"<h3>"+b.replace(/^#+ /,"")+"</h3>":/^- /m.test(b)?"<ul>"+b.split("\n").map(l=>"<li>"+l.replace(/^- /,"")+"</li>").join("")+"</ul>":"<p>"+b.replace(/\n/g,"<br>")+"</p>").join("").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")}

/* ---------- exam ---------- */
let X={};
async function examView(id){
  if(!S)return authM("in");
  const r=await api("getCourse",{id}),c=r.course;if(r.status!=="approved")return go("#/course/"+id);
  const passed=r.attempts.some(a=>a.passed);
  app.innerHTML=`<div class="wrap" style="max-width:720px"><div class="card"><a class="mut" href="#/learn/${id}">← Back to lessons</a><h2 style="margin:10px 0">${esc(c.title)}: Final exam</h2>
   <p class="mut">${c.questionCount} multiple-choice questions · ${c.examMinutes} minutes · pass mark ${c.passMark}%${c.maxAttempts?` · ${c.maxAttempts} attempts allowed`:""}</p>
   <p style="margin:14px 0">The timer starts when you begin and the exam closes and marks automatically when time runs out.</p>
   ${r.attempts.length?`<p class="mut">Previous attempts: ${r.attempts.map(a=>a.percent+"%").join(", ")}</p>`:""}
   <div style="margin-top:16px">${passed?`<span class="badge g">You passed</span> <button class="btn s" onclick='viewCert(${JSON.stringify(r.certificate||{}).replace(/'/g,"&#39;")})'>View certificate</button>`:`<button class="btn p" onclick="beginExam('${id}',this)">Start exam</button>`}</div></div></div>`;
}
const beginExam=(id,b)=>run(async()=>{
  const r=await api("startExam",{courseId:id});X={...r,id,off:r.serverNow-Date.now(),A:JSON.parse(sessionStorage.getItem("ans"+r.attemptId)||"null")||r.saved||{}};
  app.innerHTML=`<div class="wrap" style="max-width:760px"><div class="timer" id="tm"><span>Time left</span><span id="tt">--:--</span></div><div class="card" id="qs">
   ${X.questions.map((q,i)=>`<div class="q"><b>${i+1}. ${esc(q.text)}</b>${q.options.map((o,j)=>`<label><input type="radio" name="${q.id}" ${X.A[q.id]===j?"checked":""} onchange="X.A['${q.id}']=${j};sessionStorage.setItem('ans'+X.attemptId,JSON.stringify(X.A))"> ${esc(o)}</label>`).join("")}</div>`).join("")}
   <button class="btn p" style="margin-top:18px;width:100%" onclick="submitX(false,this)">Submit exam</button></div></div>`;
  clearInterval(X.iv);X.iv=setInterval(tick,500);tick();window.scrollTo(0,0)},b);
function tick(){const left=X.endsAt-(Date.now()+X.off),t=$("#tt");if(!t){clearInterval(X.iv);return}
  const s=Math.max(0,Math.ceil(left/1000));t.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");$("#tm").classList.toggle("low",s<=60);if(left<=0){clearInterval(X.iv);submitX(true)}}
async function submitX(auto,b){
  if(!auto&&!confirm("Submit your answers now?"))return;clearInterval(X.iv);
  await run(async()=>{const r=(await apiR("submitExam",{attemptId:X.attemptId,answers:X.A})).result;sessionStorage.removeItem("ans"+X.attemptId);
   app.innerHTML=`<div class="wrap" style="max-width:560px"><div class="card" style="text-align:center;padding:40px"><p class="mut">${auto?"Time is up. Your exam was marked automatically.":"Exam marked."}</p>
    <div style="font-size:64px;font-weight:800;letter-spacing:-3px;color:${r.passed?"var(--ok)":"var(--bad)"}">${r.percent}%</div><p>${r.passed?"You passed. Your certificate has been issued.":`You needed ${r.passMark}% to pass.`}</p>
    <div style="margin-top:18px;display:flex;gap:10px;justify-content:center"><a class="btn p" href="#/me">${r.passed?"See certificate":"My learning"}</a>${r.passed?"":`<a class="btn o" href="#/exam/${X.id}">Try again</a>`}</div></div></div>`},b)}

/* ---------- certificates ---------- */
function certHtml(c){const f=c.config||{},a=/^#[0-9a-f]{6}$/i.test(f.accent)?f.accent:"#0f766e";
  return `<div class="cert" style="--a:${a}"><div class="ci"><div class="ct">${esc(f.title)}</div><p style="margin-top:16px">${esc(f.intro)}</p><div class="cn">${esc(c.studentName)}</div><p>${esc(f.body)}</p><h3>${esc(c.courseTitle)}</h3>
   ${c.percent!=null?`<p>Final score <b style="color:#14213d">${c.percent}%</b></p>`:""}<div class="cs"><div><b>${fmtD(c.date)}</b><span>Date issued</span></div><div><b>${esc(f.signer)}</b><span>${esc(f.signerTitle)}</span></div></div>
   <small style="display:block;margin-top:22px">Certificate no. ${esc(c.number)}${f.footer?" · "+esc(f.footer):""}</small></div></div>`}
function viewCert(c){if(!c||!c.config)return toast("Certificate not available yet.");openM(certHtml(c)+`<button class="btn p noprint" style="width:100%;margin-top:14px" onclick="print()">Print or save as PDF</button>`,true)}

   <div class="fg"><label>Description</label><textarea class="in" id="f_x" rows="5">${esc(c.description)}</textarea></div>
   <div class="fr"><div class="fg"><label>Cover picture (upload)</label><input class="in" id="f_f" type="file" accept="image/*"></div><div class="fg"><label>…or cover picture link</label><input class="in" id="f_i" value="${esc(c.image)}" placeholder="https://"></div></div>
   <div class="fg"><label>Status</label><select class="in" id="f_s"><option value="draft" ${c.status!=="published"?"selected":""}>Draft (hidden)</option><option value="published" ${c.status==="published"?"selected":""}>Published</option></select></div>
   <div id="prog" class="mut"></div><button class="btn p" onclick="saveDetails(this)">${E.id==="new"?"Create course":"Save changes"}</button></div>`}
const saveDetails=b=>run(async()=>{
  const c={title:val("f_t"),category:val("f_c"),level:val("f_l"),duration:val("f_d"),price:Number(val("f_p")||0),description:val("f_x"),image:val("f_i"),status:val("f_s")};
  if(E.id!=="new")c.id=E.id;const r=await api("saveCourse",{course:c}),f=$("#f_f").files[0];
  if(f){const u=await upload(r.id,f,true,p=>$("#prog").textContent="Uploading cover… "+p+"%");await api("saveCourse",{course:{id:r.id,image:u.url}})}
  toast("Saved.");if(E.id==="new"){E.id=r.id;E.tab="content";go("#/admin/course/"+r.id);}else editor(E.id)},b);
async function upload(courseId,file,pub,onp){
  if(!file.size)throw new Error("That file is empty.");const mime=file.type||"application/octet-stream";
  const s=await apiR("startUpload",{courseId,fileName:file.name,mimeType:mime,totalBytes:file.size,pub});let pos=0,last;
  while(pos<file.size){const end=Math.min(pos+s.chunk,file.size);const data=await new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>ok(String(fr.result).split(",")[1]);fr.onerror=()=>no(new Error("Could not read file."));fr.readAsDataURL(file.slice(pos,end))});
    const r=await apiR("uploadChunk",{uploadId:s.uploadId,start:pos,end:end-1,total:file.size,data});pos=end;onp(Math.round(pos/file.size*100));if(r.complete){last=r;break}}
  if(!last)throw new Error("Drive did not confirm the upload.");return last}

function eContent(){
  const ls=E.lessons,ed=E.editing!=null?ls.find(l=>l.id===E.editing):null,t=ed?ed.type:"video";
  $("#ep").innerHTML=`<div class="card"><h3 style="margin-bottom:8px">Lessons</h3>${ls.map((l,i)=>`<div class="ls"><div class="ico">${TI[l.type]||"•"}</div><b style="flex:1;font-size:14px">${esc(l.title)}</b>
    <button class="btn o sm" ${i?"":"disabled"} onclick="mv(${i},-1)">↑</button><button class="btn o sm" ${i<ls.length-1?"":"disabled"} onclick="mv(${i},1)">↓</button><button class="btn s sm" onclick="E.editing='${l.id}';eContent()">Edit</button><button class="btn d sm" onclick="delL('${l.id}')">Delete</button></div>`).join("")||`<div class="empty">No lessons yet. Add the first one below.</div>`}</div>
   <div class="card"><h3 style="margin-bottom:14px">${ed?"Edit lesson":"Add a lesson"}</h3><div class="fg"><label>Lesson title</label><input class="in" id="l_t" value="${esc(ed?ed.title:"")}"></div>
   <div class="fg"><label>Type</label><select class="in" id="l_y" ${ed?"disabled":""} onchange="lType()">${[["video","Video upload"],["link","Video link (YouTube, Vimeo or .mp4)"],["text","Written text"],["pdf","PDF / book"],["image","Picture"]].map(([k,n])=>`<option value="${k}" ${t===k?"selected":""}>${n}</option>`).join("")}</select></div>
   <div id="l_x"></div><div id="prog" class="mut"></div><div style="display:flex;gap:10px"><button class="btn p" onclick="saveL(this)">${ed?"Save lesson":"Add lesson"}</button>${ed?`<button class="btn o" onclick="E.editing=null;eContent()">Cancel</button>`:""}</div></div>`;lType()}
function lType(){const t=val("l_y"),ed=E.editing!=null?E.lessons.find(l=>l.id===E.editing):null;
  $("#l_x").innerHTML=t==="link"?`<div class="fg"><label>Video link</label><input class="in" id="l_u" value="${esc(ed?ed.url:"")}" placeholder="https://www.youtube.com/watch?v=…"></div>`
   :t==="text"?`<div class="fg"><label>Lesson text (use "# Heading", "- list items" and **bold**)</label><textarea class="in" id="l_b" rows="10">${esc(ed?ed.text:"")}</textarea></div>`
   :`<div class="fg"><label>${{video:"Video file",pdf:"PDF file",image:"Picture"}[t]}${ed&&ed.hasFile?" (leave empty to keep the current file)":""}</label><input class="in" id="l_f" type="file" accept="${{video:"video/*",pdf:"application/pdf",image:"image/*"}[t]}"></div><p class="mut" style="margin-bottom:14px">Files stay private. Only approved learners can view them, and nothing is offered as a download.</p>`}
const saveL=b=>run(async()=>{
  const t=val("l_y"),ed=E.editing!=null?E.lessons.find(l=>l.id===E.editing):null,l={id:ed&&ed.id,courseId:E.id,title:val("l_t"),type:t,url:$("#l_u")?val("l_u"):"",text:$("#l_b")?val("l_b"):""};
  if(t==="link"&&!/^https:\/\//.test(l.url))throw new Error("Enter a link starting with https://");if(t==="text"&&!l.text.trim())throw new Error("Write the lesson text.");
  const f=$("#l_f")&&$("#l_f").files[0];if(!ed&&["video","pdf","image"].includes(t)&&!f)throw new Error("Choose a file to upload.");
  if(f){const u=await upload(E.id,f,false,p=>$("#prog").textContent="Uploading "+f.name+"… "+p+"%");Object.assign(l,{fileId:u.fileId,mimeType:u.mimeType,size:u.size})}
  await api("saveLesson",{lesson:l});toast("Lesson saved.");E.editing=null;editor(E.id)},b);
const delL=id=>{if(confirm("Delete this lesson and its file?"))run(async()=>{await api("deleteLesson",{id});editor(E.id)})};
const mv=(i,d)=>run(async()=>{const a=E.lessons;[a[i],a[i+d]]=[a[i+d],a[i]];await api("reorderLessons",{ids:a.map(x=>x.id)});eContent()});

function eExam(){const c=E.course,q=E.qEdit!=null?E.questions.find(x=>x.id===E.qEdit):null,opts=q?q.options:["","","",""];E.opts=opts.slice();
  $("#ep").innerHTML=`<div class="card"><h3 style="margin-bottom:12px">Exam settings</h3><div class="fr"><div class="fg"><label>Pass mark (%)</label><input class="in" id="e_p" type="number" min="1" max="100" value="${c.passMark}"></div><div class="fg"><label>Time limit (minutes)</label><input class="in" id="e_m" type="number" min="1" value="${c.examMinutes}"></div></div>
   <div class="fr"><div class="fg"><label>Attempts allowed (0 = unlimited)</label><input class="in" id="e_a" type="number" min="0" value="${c.maxAttempts}"></div><div class="fg"><label>Question order</label><select class="in" id="e_s"><option value="0" ${c.shuffle?"":"selected"}>Fixed</option><option value="1" ${c.shuffle?"selected":""}>Shuffled for each attempt</option></select></div></div>
   <p class="mut" style="margin-bottom:12px">Learners who score at or above the pass mark receive a certificate automatically.</p><button class="btn p" onclick="saveExamCfg(this)">Save settings</button></div>
   <div class="card"><h3 style="margin-bottom:8px">Questions (${E.questions.length})</h3>${E.questions.map((x,i)=>`<div class="ls"><b style="flex:1;font-size:14px">${i+1}. ${esc(x.text)}<div class="mut" style="font-weight:500">Answer: ${esc(x.options[x.answer])} · ${x.points} pt</div></b><button class="btn s sm" onclick="E.qEdit='${x.id}';eExam()">Edit</button><button class="btn d sm" onclick="delQ('${x.id}')">Delete</button></div>`).join("")||`<div class="empty">No questions yet. Without questions, finishing the lessons earns the certificate.</div>`}</div>
   <div class="card"><h3 style="margin-bottom:14px">${q?"Edit question":"Add a multiple-choice question"}</h3><div class="fg"><label>Question</label><textarea class="in" id="q_t" rows="2">${esc(q?q.text:"")}</textarea></div>
   <div class="fg"><label>Options (select the correct one)</label><div id="q_o"></div><button class="btn o sm" onclick="addOpt()">+ Add option</button></div>
   <div class="fg" style="max-width:160px"><label>Points</label><input class="in" id="q_pt" type="number" min="1" value="${q?q.points:1}"></div>
   <div style="display:flex;gap:10px"><button class="btn p" onclick="saveQ(this)">${q?"Save question":"Add question"}</button>${q?`<button class="btn o" onclick="E.qEdit=null;eExam()">Cancel</button>`:""}</div></div>`;
  E.ans=q?q.answer:0;drawOpts()}
function drawOpts(){$("#q_o").innerHTML=E.opts.map((o,i)=>`<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><input type="radio" name="ca" ${E.ans===i?"checked":""} onchange="E.ans=${i}"><input class="in" value="${esc(o)}" oninput="E.opts[${i}]=this.value" placeholder="Option ${i+1}">${E.opts.length>2?`<button class="btn d sm" onclick="E.opts.splice(${i},1);if(E.ans>=E.opts.length)E.ans=0;drawOpts()">×</button>`:""}</div>`).join("")}
function addOpt(){if(E.opts.length<6){E.opts.push("");drawOpts()}}
const saveExamCfg=b=>run(async()=>{await api("saveCourse",{course:{id:E.id,passMark:Number(val("e_p")),examMinutes:Number(val("e_m")),maxAttempts:Number(val("e_a")),shuffle:val("e_s")==="1"}});toast("Exam settings saved.");editor(E.id)},b);
const saveQ=b=>run(async()=>{const idx=E.opts.map((o,i)=>[o.trim(),i]).filter(x=>x[0]);const ans=idx.findIndex(x=>x[1]===E.ans);
  await api("saveQuestion",{question:{id:E.qEdit,courseId:E.id,text:val("q_t"),options:idx.map(x=>x[0]),answer:ans,points:Number(val("q_pt")||1)}});toast("Question saved.");E.qEdit=null;editor(E.id)},b);
const delQ=id=>run(async()=>{await api("deleteQuestion",{id});editor(E.id)});

function eCert(){const c=E.course,f=c.certConfig;
  const fld=(k,l)=>`<div class="fg"><label>${l}</label><input class="in" id="c_${k}" value="${esc(f[k])}" oninput="certPrev()"></div>`;
  $("#ep").innerHTML=`<div class="card"><p class="mut" style="margin-bottom:14px">Changes apply to every certificate for this course, including ones already issued.</p>${fld("title","Heading")}${fld("intro","Line above the learner's name")}${fld("body","Line above the course name")}
   <div class="fr">${fld("signer","Signatory name")}${fld("signerTitle","Signatory title")}</div><div class="fr">${fld("footer","Footer note (optional)")}<div class="fg"><label>Accent colour</label><input class="in" id="c_accent" type="color" value="${esc(f.accent)}" oninput="certPrev()" style="height:42px;padding:4px"></div></div>
   <div class="fg"><label><input type="checkbox" id="c_show" ${c.showScore?"checked":""} onchange="certPrev()"> Show the learner's percentage on the certificate</label></div>
   <p class="mut" style="margin-bottom:12px">Pass mark is ${c.passMark}% (change it on the Exam tab).</p><button class="btn p" onclick="saveCert(this)">Save certificate</button></div><div class="card"><div class="mut" style="margin-bottom:10px">Preview</div><div id="cprev"></div></div>`;certPrev()}
const certCfg=()=>Object.fromEntries(["title","intro","body","signer","signerTitle","footer","accent"].map(k=>[k,val("c_"+k)]));
function certPrev(){$("#cprev").innerHTML=certHtml({studentName:"Student Name",courseTitle:E.course.title||"Course title",number:"LUX-0000-2026-0000",date:Date.now(),percent:$("#c_show").checked?85:null,config:certCfg()})}
const saveCert=b=>run(async()=>{await api("saveCourse",{course:{id:E.id,certConfig:certCfg(),showScore:$("#c_show").checked}});toast("Certificate saved.");editor(E.id)},b);

/* ---------- boot ---------- */
nav();route();
</script>
</body>
</html>
