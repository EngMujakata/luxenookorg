<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Luxenook Online Courses</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./logo-192.png">
<script>
(function(){var t;try{t=localStorage.getItem("lx-theme")}catch(e){}
if(!t)t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";
document.documentElement.dataset.theme=t;
var m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==="dark"?"#0a1224":"#ffffff"})();
</script>
<style>
:root,[data-theme=light]{--bg:#f4f8ff;--card:#fff;--ink:#0b1b3a;--mut:#5b6b8a;--line:#dbe5f6;--ac:#2563eb;--ac2:#1d4ed8;--soft:#e8f0ff;--bad:#dc2626;--ok:#059669;--r:14px;--sh:0 1px 2px rgba(11,27,58,.05),0 8px 24px rgba(37,99,235,.09)}
[data-theme=dark]{--bg:#0a1224;--card:#101b33;--ink:#e8eefc;--mut:#94a6c8;--line:#1e2c4a;--soft:#142650;--ac:#3b82f6;--ac2:#2563eb;--sh:none;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.hdr{position:sticky;top:0;z-index:50;height:64px;display:flex;align-items:center;gap:12px;padding:0 max(18px,4vw);background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.4px}.brand img{width:34px;height:34px;border-radius:9px}
.brand i{font-style:normal;color:var(--ac)}.sp{flex:1}
.nav{display:flex;gap:6px;align-items:center}
.btn{border:1px solid transparent;border-radius:10px;padding:9px 16px;font-weight:700;font-size:14px;background:var(--ac);color:#fff;transition:background .15s}
.btn:hover{background:var(--ac2)}.btn:disabled{opacity:.5;pointer-events:none}
.btn.o{background:transparent;border-color:var(--line);color:var(--ink)}.btn.o:hover{background:var(--soft)}
.btn.s{background:var(--soft);color:var(--ac)}.btn.d{background:transparent;color:var(--bad);border-color:var(--line)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}.btn.ic{padding:8px 12px;font-size:16px;line-height:1}
.wrap{max-width:1180px;margin:auto;padding:28px max(18px,4vw)}
.hero{padding:48px 0 26px}.hero h1{font-size:clamp(32px,5.2vw,56px);line-height:1.05;letter-spacing:-1.8px;max-width:760px}
.hero p{color:var(--mut);font-size:18px;max-width:560px;margin:16px 0 26px}
.search{display:flex;max-width:600px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:var(--sh)}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;padding:0 14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 20px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 15px;font-size:13px;font-weight:700;color:var(--mut)}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:20px}
.cc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:box-shadow .2s;content-visibility:auto;contain-intrinsic-size:auto 330px}
.cc:hover{box-shadow:var(--sh)}
.im{aspect-ratio:16/10;background:var(--soft);position:relative;overflow:hidden}
.im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cc .im b{position:absolute;left:10px;bottom:10px;background:var(--card);border-radius:7px;padding:3px 9px;font-size:12px}
.cc .bd{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}.cc h3{font-size:17px;line-height:1.25;letter-spacing:-.3px}
.cc p{font-size:13px;color:var(--mut)}.meta{display:flex;gap:12px;font-size:12px;color:var(--mut);margin-top:auto;padding-top:8px;flex-wrap:wrap}
.sk{background:linear-gradient(90deg,var(--line),var(--soft),var(--line));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:var(--r);height:300px}@keyframes sk{to{background-position:-200% 0}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:18px}
h2{font-size:24px;letter-spacing:-.6px}h3{letter-spacing:-.3px}.mut{color:var(--mut);font-size:13px}
.cd{display:grid;grid-template-columns:1.3fr .7fr;gap:30px;align-items:start}
.cd .im{border-radius:var(--r)}
.cd h1{font-size:clamp(28px,4vw,40px);letter-spacing:-1.2px;line-height:1.1;margin:8px 0 12px}
.badge{display:inline-block;border-radius:99px;padding:3px 10px;font-size:11px;font-weight:800;background:var(--soft);color:var(--ac)}
.badge.w{background:#fef3c7;color:#92400e}.badge.r{background:#fee2e2;color:#991b1b}.badge.g{background:#d1fae5;color:#065f46}
.ls{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}.ls:last-child{border:0}
.ico{width:34px;height:34px;border-radius:9px;background:var(--soft);color:var(--ac);display:grid;place-items:center;font-size:14px;flex:none}
.th{width:56px;height:40px;border-radius:8px;overflow:hidden;background:var(--soft);flex:none}.th img{width:100%;height:100%;object-fit:cover;display:block}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.learn{display:grid;grid-template-columns:310px 1fr;gap:20px;align-items:start}
.side{position:sticky;top:80px;max-height:calc(100vh - 100px);overflow:auto}
.li{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:10px;font-size:14px;font-weight:600}
.li:hover,.li.on{background:var(--soft)}.li .ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:11px;color:#fff}
.li .ck.d{background:var(--ok);border-color:var(--ok)}
.vw{aspect-ratio:16/9;background:#000;border-radius:var(--r);overflow:hidden;display:grid;place-items:center;color:#cbd5e1;text-align:center}
.vw video,.vw iframe,.vw img{width:100%;height:100%;border:0;object-fit:contain;-webkit-user-select:none;user-select:none}
.prose{max-width:70ch}.prose p,.prose ul{margin:0 0 14px}.prose h3{margin:20px 0 8px}.prose ul{padding-left:20px}
.in{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;outline:0}.in:focus{border-color:var(--ac)}
.fg{margin-bottom:14px}.fg label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:var(--mut)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px}
.st div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}.st b{display:block;font-size:26px;letter-spacing:-.8px;color:var(--ac)}.st span{font-size:12px;color:var(--mut)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tab{background:none;border:0;padding:11px 15px;font-weight:700;font-size:14px;color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap}.tab.on{color:var(--ac);border-color:var(--ac)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--mut);font-size:12px;padding:10px;border-bottom:1px solid var(--line)}td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.ov{position:fixed;inset:0;background:rgba(6,16,40,.6);display:grid;place-items:center;padding:16px;z-index:100;overflow:auto}
.box{background:var(--card);border-radius:18px;width:min(520px,100%);padding:26px;position:relative;max-height:94vh;overflow:auto}.box.l{width:min(860px,100%)}
.x{position:absolute;right:14px;top:14px;border:0;background:var(--soft);border-radius:50%;width:30px;height:30px;font-size:17px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,90px);background:var(--ac2);color:#fff;padding:12px 18px;border-radius:11px;font-size:14px;z-index:300;transition:transform .25s;max-width:92vw}.toast.on{transform:translate(-50%,0)}
.empty{padding:34px;text-align:center;color:var(--mut)}
.q{padding:18px 0;border-bottom:1px solid var(--line)}.q label{display:flex;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;margin-top:8px;cursor:pointer}.q label:has(input:checked){border-color:var(--ac);background:var(--soft)}
.timer{position:sticky;top:64px;z-index:20;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:800}
.timer.low{color:var(--bad);border-color:var(--bad)}
.cert{background:#fff;color:#14213d;border:10px solid var(--a);padding:14px;text-align:center}
.cert .ci{border:1px solid #cbd5e1;padding:34px 18px}.cert .ct{font-size:30px;font-weight:800;color:var(--a);letter-spacing:-.8px}.cert .cn{font-size:30px;font-weight:800;margin:14px 0;border-bottom:2px solid var(--a);display:inline-block;padding:0 24px}
.cert p{color:#64748b}.cert h3{font-size:22px;margin:8px 0}.cert .cs{display:flex;justify-content:space-around;gap:20px;margin-top:30px}.cert .cs div{flex:1;border-top:1px solid #94a3b8;padding-top:6px}.cert .cs b{display:block}.cert .cs span,.cert small{font-size:11px;color:#64748b}
footer{padding:30px;text-align:center;color:var(--mut);font-size:12px}
@media(max-width:820px){.cd,.learn{grid-template-columns:1fr}.side{position:static;max-height:none}.fr{grid-template-columns:1fr}.nav .hide{display:none}.hero{padding-top:28px}}
@media print{.hdr,#app,.toast,footer,.noprint{display:none!important}.ov{position:static;background:none;padding:0}.box{box-shadow:none;padding:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<header class="hdr">
  <a class="brand" href="#/"><img src="./logo-192.png" alt="" onerror="this.remove()">Luxe<i>nook</i></a>
  <div class="sp"></div><nav class="nav" id="nav"></nav>
  <button class="btn o ic" id="tg" onclick="toggleTheme()" aria-label="Switch theme"></button>
</header>
<main id="app"></main>
<footer>© 2026 Luxenook Online Courses · Powered by Electrify Technologies</footer>
<div class="toast" id="toast" role="status"></div>
<div id="mroot"></div>

<script>
const API="https://script.google.com/macros/s/AKfycbzd9Fp1B9gAV6D6KeAhjspbeAkizA8-d6_t6SLdUBEyYIgFRrm3V3trDaDP9XHLjUfK/exec";
const MAX_OPS=500;            // rows/operations per API call
const DIRECT_CHUNK=8*1024*1024; // direct-to-Drive chunk (multiple of 256 KB)
const $=(s,r=document)=>r.querySelector(s), app=$("#app");
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtD=t=>new Date(Number(t)).toLocaleDateString(undefined,{day:"numeric",month:"long",year:"numeric"});
const money=n=>Number(n)?"$"+Number(n).toFixed(2):"Free";
const img=(u,eager)=>u?`<img src="${esc(u)}" ${eager?"":'loading="lazy"'} decoding="async" alt="" onerror="this.remove()">`:"";
const nid=p=>p+Array.from(crypto.getRandomValues(new Uint8Array(6)),b=>b.toString(16).padStart(2,"0")).join("").toUpperCase();
const uuid=()=>crypto.randomUUID?crypto.randomUUID():nid("OP")+nid("");
let S=JSON.parse(localStorage.getItem("lx")||"null"), IO=null;

/* ---------- theme ---------- */
function theme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem("lx-theme",t)}catch(e){}
  const m=document.querySelector("meta[name=theme-color]");if(m)m.content=t==="dark"?"#0a1224":"#ffffff";
  const b=$("#tg");if(b){b.textContent=t==="dark"?"☀":"☾";b.title=t==="dark"?"Switch to light theme":"Switch to dark theme"}}
const toggleTheme=()=>theme(document.documentElement.dataset.theme==="dark"?"light":"dark");

/* ---------- core ---------- */
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),4200)}
async function api(action,d={}){
  const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,token:S&&S.token,...d}),signal:AbortSignal.timeout?AbortSignal.timeout(90000):undefined});
  let j;try{j=await r.json()}catch(e){throw new Error("Server returned an invalid response. Try again.")}
  if(!j.success){if(j.message==="SESSION_EXPIRED"){signOut(true);throw new Error("Your session expired. Please sign in again.")}throw new Error(j.message||"Request failed.")}
  return j}
async function apiR(a,d,n=3){let e;for(let i=0;i<n;i++){try{return await api(a,d)}catch(x){e=x;if(/expired|sign in/i.test(x.message))throw x;await new Promise(r=>setTimeout(r,500*2**i))}}throw e}
async function run(fn,btn){if(btn)btn.disabled=true;try{return await fn()}catch(e){toast(e.message)}finally{if(btn)btn.disabled=false}}
function openM(html,large){closeM();$("#mroot").innerHTML=`<div class="ov" onmousedown="if(event.target===this)closeM()"><div class="box ${large?"l":""}"><button class="x noprint" onclick="closeM()" aria-label="Close">×</button>${html}</div></div>`}
function closeM(){$("#mroot").innerHTML=""}
function go(h){location.hash=h}
function skel(n=6){return `<div class="grid">${"<div class=sk></div>".repeat(n)}</div>`}

/* ---------- IndexedDB: media (offline lessons), cache (instant loads), outbox (save before sync) ---------- */
const DB=()=>DB._p||(DB._p=new Promise((ok,no)=>{const r=indexedDB.open("luxenook",2);
  r.onupgradeneeded=()=>{const d=r.result;[["media","id"],["cache","k"],["outbox","id"]].forEach(([n,k])=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:k})})};
  r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}));
const tx=(st,mode,fn)=>DB().then(db=>new Promise((ok,no)=>{const t=db.transaction(st,mode),q=fn(t.objectStore(st));t.oncomplete=()=>ok(q&&q.result);t.onerror=t.onabort=()=>no(t.error)}));
const kv={get:(s,k)=>tx(s,"readonly",o=>o.get(k)),all:s=>tx(s,"readonly",o=>o.getAll()),put:(s,v)=>tx(s,"readwrite",o=>o.put(v)),del:(s,k)=>tx(s,"readwrite",o=>o.delete(k)),clear:s=>tx(s,"readwrite",o=>o.clear())};
const idbGet=id=>kv.get("media",id),idbAll=()=>kv.all("media"),idbPut=o=>kv.put("media",o),idbDel=id=>kv.del("media",id);

// stale-while-revalidate: paint cached data instantly, then refresh from the server
async function swr(key,action,d,paint){
  const c=await kv.get("cache",key).catch(()=>null);let shown=c&&c.v;if(shown)paint(shown);
  try{const r=await api(action,d);if(JSON.stringify(r)!==JSON.stringify(shown))paint(r);kv.put("cache",{k:key,v:r,at:Date.now()}).catch(()=>{});return r}
  catch(e){if(!shown)throw e}}

/* ---------- outbox: write locally first, then sync in atomic batches of up to 500 ---------- */
async function enqueue(type,data,key){
  const op={id:uuid(),type,data,key:key||"",uid:S&&S.uid,at:Date.now()};
  try{
    if(key){const all=await kv.all("outbox");await tx("outbox","readwrite",o=>{all.filter(x=>x.key===key).forEach(x=>o.delete(x.id));o.put(op)})}
    else await kv.put("outbox",op);
  }catch(e){await api("sync",{ops:[{id:op.id,type,data}]});return op}  // IndexedDB unavailable: send directly
  flush();return op}
let FL=null;
function flush(){return FL||(FL=(async()=>{try{
  if(!S||!navigator.onLine)return;
  for(;;){
    const all=(await kv.all("outbox")).filter(o=>o.uid===S.uid).sort((a,b)=>a.at-b.at);if(!all.length)return;
    const batch=all.slice(0,MAX_OPS),r=await apiR("sync",{ops:batch.map(o=>({id:o.id,type:o.type,data:o.data}))});
    const ack=r.results.map(x=>x.id);if(!ack.length)return;
    await tx("outbox","readwrite",o=>{ack.forEach(i=>o.delete(i))});   // acknowledged (applied, duplicate or rejected) ops leave the outbox
    r.results.filter(x=>!x.ok).forEach(x=>toast(x.error));
    if(all.length<=batch.length)return}
}catch(e){}finally{FL=null}})())}
const pending=async()=>S?(await kv.all("outbox").catch(()=>[])).filter(o=>o.uid===S.uid).length:0;
const dropKey=async k=>{try{const all=await kv.all("outbox");await tx("outbox","readwrite",o=>{all.filter(x=>x.key===k).forEach(x=>o.delete(x.id))})}catch(e){}};
addEventListener("online",flush);setInterval(flush,20000);

/* ---------- header / auth ---------- */
function nav(){
  $("#nav").innerHTML=!S?`<button class="btn o" onclick="authM('in')">Sign in</button><button class="btn" onclick="authM('up')">Create account</button>`
   :`<a class="btn o" href="#/${S.role==="admin"?"admin":"me"}">${S.role==="admin"?"Admin":"My learning"}</a><button class="btn o hide" onclick="signOut()">Sign out</button>`}
function authM(mode){
  openM(mode==="up"?`<h2>Create your account</h2><p class="mut" style="margin:4px 0 18px">Browse for free. Create an account to request a course.</p>
   <div class="fr"><div class="fg"><label>First name</label><input class="in" id="fn"></div><div class="fg"><label>Last name</label><input class="in" id="ln"></div></div>
   <div class="fg"><label>Email</label><input class="in" id="em" type="email"></div><div class="fg"><label>Username</label><input class="in" id="un"></div>
   <div class="fg"><label>Password (6+ characters)</label><input class="in" id="pw" type="password"></div>
   <button class="btn" style="width:100%" onclick="doSignup(this)">Create account</button><p class="mut" style="text-align:center;margin-top:14px">Have an account? <a href="#" onclick="authM('in');return false" style="color:var(--ac);font-weight:700">Sign in</a></p>`
  :`<h2>Welcome back</h2><p class="mut" style="margin:4px 0 18px">Sign in to continue.</p>
   <div class="fg"><label>Account type</label><select class="in" id="rl"><option value="student">Student</option><option value="admin">Administrator</option></select></div>
   <div class="fg"><label>Username or email</label><input class="in" id="un" autocomplete="username"></div>
   <div class="fg"><label>Password</label><input class="in" id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin(this.closest('.box').querySelector('.btn:not(.x)'))"></div>
   <button class="btn" style="width:100%" onclick="doLogin(this)">Sign in</button><p class="mut" style="text-align:center;margin-top:14px">New here? <a href="#" onclick="authM('up');return false" style="color:var(--ac);font-weight:700">Create an account</a></p>`)}
function setSession(s){S=s;localStorage.setItem("lx",JSON.stringify(s));closeM();nav();route();flush()}
const doSignup=b=>run(async()=>{const v=i=>$("#"+i).value.trim();const r=await api("signup",{firstName:v("fn"),lastName:v("ln"),email:v("em"),username:v("un"),password:$("#pw").value});setSession(r.session);toast("Account created.")},b);
const doLogin=b=>run(async()=>{const r=await api("login",{role:$("#rl").value,username:$("#un").value,password:$("#pw").value});setSession(r.session);go(r.session.role==="admin"?"#/admin":"#/me")},b);
function signOut(silent){S=null;localStorage.removeItem("lx");kv.clear("media").catch(()=>{});nav();if(!silent)toast("Signed out.");go("#/");route()}  // unsent outbox items stay on the device and sync after the same user signs in again

/* ---------- router ---------- */
function route(){
  if(IO){IO.disconnect();IO=null}closeM();window.scrollTo(0,0);
  const p=(location.hash.slice(2)||"").split("/");
  const v={"":home,course:()=>courseView(p[1]),learn:()=>learn(p[1]),exam:()=>examView(p[1]),me:dash,admin:()=>p[1]==="course"?editor(p[2]):admin(p[1]||"overview")}[p[0]];
  Promise.resolve(v?v():home()).catch(e=>{app.innerHTML=`<div class="wrap"><div class="card empty">${esc(e.message)}<br><br><a class="btn" href="#/">Back to courses</a></div></div>`});
}
window.addEventListener("hashchange",route);

/* ---------- home (lazy: 10 at a time, cached first page) ---------- */
let H={};
async function home(){
  H={off:0,q:"",cat:"",busy:false,more:true,id:0};
  app.innerHTML=`<div class="wrap"><section class="hero"><h1>Learn something worth a certificate.</h1><p>Short, structured courses with video, reading and a timed exam at the end. Browse freely, sign in when you're ready to learn.</p>
   <div class="search"><input id="q" placeholder="Search courses" onkeydown="if(event.key==='Enter')hFilter()"><button class="btn" onclick="hFilter()">Search</button></div></section>
   <div class="chips" id="chips"></div><div class="grid" id="grid"></div><div id="sent" style="height:2px"></div></div>`;
  swr("cats","getCategories",{},r=>{$("#chips").innerHTML=["All",...r.categories].map(c=>`<button class="chip ${c===(H.cat||"All")?"on":""}" onclick="hCat(this,'${esc(c).replace(/'/g,"\\'")}')">${esc(c)}</button>`).join("")}).catch(()=>{});
  IO=new IntersectionObserver(e=>{if(e[0].isIntersecting)loadMore()},{rootMargin:"500px"});IO.observe($("#sent"));loadMore();
}
function hFilter(){H={...H,off:0,q:$("#q").value.trim(),more:true,busy:false,id:H.id+1};$("#grid").innerHTML="";loadMore()}

    const sb=$("#svb");if(sb)sb.onclick=()=>run(async()=>{await idbPut({id:m.id,meta:m,blob,title:m.title,at:Date.now()});toast("Saved for offline viewing in this app.");$("#offb").innerHTML=`<button class="btn o" onclick="rmOff('${m.id}')">Remove offline copy</button>`},sb);

// 4 parallel range reads, each decoded natively (no per-byte JS loop)
async function fetchBlob(m,onp){
  const size=m.size||0,CH=m.chunk||1048576;if(!size)throw new Error("This file is empty.");
  const N=Math.ceil(size/CH),parts=new Array(N);let next=0,got=0;
  await Promise.all(Array.from({length:Math.min(4,N)},async()=>{while(next<N){const i=next++;const r=await apiR("mediaChunk",{lessonId:m.id,start:i*CH});
    parts[i]=await (await fetch("data:application/octet-stream;base64,"+r.data)).blob();onp(Math.round(++got/N*100))}}));
  return new Blob(parts,{type:m.mimeType||"application/octet-stream"})}
function showMedia(el,m,blob){
  const u=URL.createObjectURL(blob),t=m.mimeType||"";
  el.innerHTML=t.startsWith("video/")?`<video src="${u}" controls controlsList="nodownload noremoteplayback" disablePictureInPicture playsinline oncontextmenu="return false"></video>`
   :t.startsWith("image/")?`<img src="${u}" draggable="false" oncontextmenu="return false" alt="${esc(m.title)}">`
   :t==="application/pdf"?`<iframe src="${u}#toolbar=0&navpanes=0"></iframe>`:`<div style="padding:20px">This file type can't be shown in the browser. Ask your instructor for a PDF or video version.</div>`}
const rmOff=id=>run(async()=>{await idbDel(id);toast("Offline copy removed.");openLesson(id)});
// progress is saved on this device first, then synced in the background
const markDone=async(lid,b)=>{if(L.done.has(lid))return;L.done.add(lid);b.textContent="Completed ✓";lList();await enqueue("done",{lessonId:lid});
  const ls=L.r.lessons,i=ls.findIndex(x=>x.id===lid);
  if(L.done.size>=ls.length)toast(L.r.course.questionCount?"All lessons done. The exam is unlocked.":"Course complete. Your certificate will appear in My learning.");
  else if(ls[i+1])openLesson(ls[i+1].id)};
function embed(u){let m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);if(m)return"https://www.youtube-nocookie.com/embed/"+m[1]+"?rel=0&modestbranding=1";m=u.match(/vimeo\.com\/(?:video\/)?(\d+)/);if(m)return"https://player.vimeo.com/video/"+m[1];return/^https:\/\//.test(u)?u:""}
function md(t){return esc(t).split(/\n{2,}/).map(b=>/^#{1,3} /.test(b)?"<h3>"+b.replace(/^#+ /,"")+"</h3>":/^- /m.test(b)?"<ul>"+b.split("\n").map(l=>"<li>"+l.replace(/^- /,"")+"</li>").join("")+"</ul>":"<p>"+b.replace(/\n/g,"<br>")+"</p>").join("").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")}

/* ---------- course editor ---------- */
let E={};
async function editor(id){
  if(!S||S.role!=="admin")return authM("in");
  if(id==="new")E={id,newId:nid("LC"),course:{status:"draft",level:"Beginner",passMark:50,examMinutes:30,maxAttempts:0,showScore:true,shuffle:false,price:0,certConfig:{title:"Certificate of Completion",intro:"This certificate is proudly presented to",body:"for successfully completing",signer:"",signerTitle:"",accent:"#2563eb",footer:""}},lessons:[],questions:[],tab:"details"};

function drawE(){

   <div class="tabs">${tabs.map(([k,n])=>`<button class="tab ${E.tab===k?"on":""}" ${isNew&&k!=="details"?"disabled style='opacity:.4'":""} onclick="E.tab='${k}';drawE()">${n}</button>`).join("")}</div><div id="ep"></div></div>`;

const val=i=>$("#"+i).value;
function eDetails(){const c=E.course;
  $("#ep").innerHTML=`<div class="card"><div class="fg"><label>Course title</label><input class="in" id="f_t" value="${esc(c.title)}"></div>
   <div class="fr"><div class="fg"><label>Category (pick or type a new one)</label><input class="in" id="f_c" list="cl" value="${esc(c.category)}"><datalist id="cl">${E.cats.map(x=>`<option value="${esc(x)}">`).join("")}</datalist></div>
   <div class="fg"><label>Level</label><select class="in" id="f_l">${["Beginner","Intermediate","Advanced"].map(x=>`<option ${c.level===x?"selected":""}>${x}</option>`).join("")}</select></div></div>
   <div class="fr"><div class="fg"><label>Duration</label><input class="in" id="f_d" value="${esc(c.duration)}" placeholder="6 hours"></div><div class="fg"><label>Price (USD, 0 = free and instantly approved)</label><input class="in" id="f_p" type="number" min="0" step="0.01" value="${c.price}"></div></div>
   <div class="fg"><label>Description</label><textarea class="in" id="f_x" rows="5">${esc(c.description)}</textarea></div>
   <div class="fr"><div class="fg"><label>Cover picture (upload)</label><input class="in" id="f_f" type="file" accept="image/*"></div><div class="fg"><label>…or cover picture link</label><input class="in" id="f_i" value="${esc(c.image)}" placeholder="https://"></div></div>
   <div class="fg"><label>Status</label><select class="in" id="f_s"><option value="draft" ${c.status!=="published"?"selected":""}>Draft (hidden)</option><option value="published" ${c.status==="published"?"selected":""}>Published</option></select></div>
   <div id="prog" class="mut"></div><button class="btn" onclick="saveDetails(this)">${E.id==="new"?"Create course":"Save changes"}</button></div>`}
const saveDetails=b=>run(async()=>{
  const c={title:val("f_t"),category:val("f_c"),level:val("f_l"),duration:val("f_d"),price:Number(val("f_p")||0),description:val("f_x"),image:val("f_i"),status:val("f_s")};
  c.id=E.id==="new"?E.newId:E.id;   // client-made id: a retried create can never duplicate the course
  const r=await api("saveCourse",{course:c}),f=$("#f_f").files[0];
  if(f){const u=await upload(r.id,f,true,p=>$("#prog").textContent="Uploading cover… "+p+"%");await api("saveCourse",{course:{id:r.id,image:u.url}})}
  toast("Saved.");if(E.id==="new"){go("#/admin/course/"+r.id)}else editor(E.id)},b);

/* ---------- uploads: straight to Drive, 8 MB chunks, automatic fallback through the server ---------- */
const putChunk=(url,blob,a,b,total,onb)=>new Promise((ok,no)=>{const x=new XMLHttpRequest();x.open("PUT",url);x.setRequestHeader("Content-Range",`bytes ${a}-${b}/${total}`);
  x.upload.onprogress=e=>onb(e.loaded);x.onerror=()=>no(new Error("network"));
  x.onload=()=>{if(x.status===308)ok({complete:false});else if(x.status===200||x.status===201){try{ok({complete:true,fileId:JSON.parse(x.responseText).id})}catch(e){no(e)}}else no(new Error("HTTP "+x.status))};x.send(blob)});
const b64=blob=>new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>ok(String(fr.result).split(",")[1]);fr.onerror=()=>no(new Error("Could not read file."));fr.readAsDataURL(blob)});
async function upload(courseId,file,pub,onp){
  if(!file.size)throw new Error("That file is empty.");const mime=file.type||"application/octet-stream";
  const s=await apiR("startUpload",{courseId,fileName:file.name,mimeType:mime,totalBytes:file.size,pub,origin:location.origin==="null"?"":location.origin});
  let pos=0,direct=!!s.loc,fileId;
  while(pos<file.size){
    const size=direct?DIRECT_CHUNK:s.chunk,end=Math.min(pos+size,file.size),blob=file.slice(pos,end);let r=null;
    if(direct){for(let t=0;t<2&&!r;t++){try{r=await putChunk(s.loc,blob,pos,end-1,file.size,l=>onp(Math.round((pos+l)/file.size*100)))}catch(e){}}if(!r)direct=false}
    if(!r){const data=await b64(blob);r=await apiR("uploadChunk",{uploadId:s.uploadId,start:pos,end:end-1,total:file.size,data})}
    pos=end;onp(Math.round(pos/file.size*100));if(r.complete){fileId=r.fileId;break}}
  if(!fileId)throw new Error("Drive did not confirm the upload.");
  return await apiR("finishUpload",{uploadId:s.uploadId,fileId})}   // server verifies folder and size before the file is used

function eContent(){
  const ls=E.lessons,ed=E.editing!=null?ls.find(l=>l.id===E.editing):null,t=ed?ed.type:"video";
  $("#ep").innerHTML=`<div class="card"><h3 style="margin-bottom:8px">Lessons</h3>${ls.map((l,i)=>`<div class="ls"><div class="ico">${TI[l.type]||"•"}</div><b style="flex:1;font-size:14px">${esc(l.title)}</b>
    <button class="btn o sm" ${i?"":"disabled"} onclick="mv(${i},-1)">↑</button><button class="btn o sm" ${i<ls.length-1?"":"disabled"} onclick="mv(${i},1)">↓</button><button class="btn s sm" onclick="E.editing='${l.id}';eContent()">Edit</button><button class="btn d sm" onclick="delL('${l.id}')">Delete</button></div>`).join("")||`<div class="empty">No lessons yet. Add the first one below.</div>`}</div>
   <div class="card"><h3 style="margin-bottom:14px">${ed?"Edit lesson":"Add a lesson"}</h3><div class="fg"><label>Lesson title</label><input class="in" id="l_t" value="${esc(ed?ed.title:"")}"></div>
   <div class="fg"><label>Type</label><select class="in" id="l_y" ${ed?"disabled":""} onchange="lType()">${[["video","Video upload"],["link","Video link (YouTube, Vimeo or .mp4)"],["text","Written text"],["pdf","PDF / book"],["image","Picture"]].map(([k,n])=>`<option value="${k}" ${t===k?"selected":""}>${n}</option>`).join("")}</select></div>
   <div id="l_x"></div><div id="prog" class="mut"></div><div style="display:flex;gap:10px"><button class="btn" onclick="saveL(this)">${ed?"Save lesson":"Add lesson"}</button>${ed?`<button class="btn o" onclick="E.editing=null;eContent()">Cancel</button>`:""}</div></div>`;lType()}
function lType(){const t=val("l_y"),ed=E.editing!=null?E.lessons.find(l=>l.id===E.editing):null;
  $("#l_x").innerHTML=t==="link"?`<div class="fg"><label>Video link</label><input class="in" id="l_u" value="${esc(ed?ed.url:"")}" placeholder="https://www.youtube.com/watch?v=…"></div>`
   :t==="text"?`<div class="fg"><label>Lesson text (use "# Heading", "- list items" and **bold**)</label><textarea class="in" id="l_b" rows="10">${esc(ed?ed.text:"")}</textarea></div>`
   :`<div class="fg"><label>${{video:"Video file",pdf:"PDF file",image:"Picture"}[t]}${ed&&ed.hasFile?" (leave empty to keep the current file)":""}</label><input class="in" id="l_f" type="file" accept="${{video:"video/*",pdf:"application/pdf",image:"image/*"}[t]}"></div><p class="mut" style="margin-bottom:14px">Files stay private. Only approved learners can view them, and nothing is offered as a download.</p>`}
const saveL=b=>run(async()=>{
  const t=val("l_y"),ed=E.editing!=null?E.lessons.find(l=>l.id===E.editing):null;
  const l={id:ed?ed.id:(E.lid=E.lid||nid("LS")),courseId:E.id,title:val("l_t"),type:t,url:$("#l_u")?val("l_u"):"",text:$("#l_b")?val("l_b"):""};
  if(t==="link"&&!/^https:\/\//.test(l.url))throw new Error("Enter a link starting with https://");if(t==="text"&&!l.text.trim())throw new Error("Write the lesson text.");
  const f=$("#l_f")&&$("#l_f").files[0];if(!ed&&["video","pdf","image"].includes(t)&&!f)throw new Error("Choose a file to upload.");
  if(f){const u=await upload(E.id,f,false,p=>$("#prog").textContent="Uploading "+f.name+"… "+p+"%");Object.assign(l,{fileId:u.fileId,mimeType:u.mimeType,size:u.size})}
  await api("saveLesson",{lesson:l});E.lid=null;toast("Lesson saved.");E.editing=null;editor(E.id)},b);
const delL=id=>{if(confirm("Delete this lesson and its file?"))run(async()=>{await api("deleteLesson",{id});editor(E.id)})};
const mv=(i,d)=>run(async()=>{const a=E.lessons;[a[i],a[i+d]]=[a[i+d],a[i]];await api("reorderLessons",{ids:a.map(x=>x.id)});eContent()});

function eExam(){const c=E.course,q=E.qEdit!=null?E.questions.find(x=>x.id===E.qEdit):null,opts=q?q.options:["","","",""];E.opts=opts.slice();
  $("#ep").innerHTML=`<div class="card"><h3 style="margin-bottom:12px">Exam settings</h3><div class="fr"><div class="fg"><label>Pass mark (%)</label><input class="in" id="e_p" type="number" min="1" max="100" value="${c.passMark}"></div><div class="fg"><label>Time limit (minutes)</label><input class="in" id="e_m" type="number" min="1" value="${c.examMinutes}"></div></div>
   <div class="fr"><div class="fg"><label>Attempts allowed (0 = unlimited)</label><input class="in" id="e_a" type="number" min="0" value="${c.maxAttempts}"></div><div class="fg"><label>Question order</label><select class="in" id="e_s"><option value="0" ${c.shuffle?"":"selected"}>Fixed</option><option value="1" ${c.shuffle?"selected":""}>Shuffled for each attempt</option></select></div></div>
   <p class="mut" style="margin-bottom:12px">Learners who score at or above the pass mark receive a certificate automatically.</p><button class="btn" onclick="saveExamCfg(this)">Save settings</button></div>
   <div class="card"><h3 style="margin-bottom:8px">Questions (${E.questions.length})</h3>${E.questions.map((x,i)=>`<div class="ls"><b style="flex:1;font-size:14px">${i+1}. ${esc(x.text)}<div class="mut" style="font-weight:500">Answer: ${esc(x.options[x.answer])} · ${x.points} pt</div></b><button class="btn s sm" onclick="E.qEdit='${x.id}';eExam()">Edit</button><button class="btn d sm" onclick="delQ('${x.id}')">Delete</button></div>`).join("")||`<div class="empty">No questions yet. Without questions, finishing the lessons earns the certificate.</div>`}</div>
   <div class="card"><h3 style="margin-bottom:14px">${q?"Edit question":"Add a multiple-choice question"}</h3><div class="fg"><label>Question</label><textarea class="in" id="q_t" rows="2">${esc(q?q.text:"")}</textarea></div>
   <div class="fg"><label>Options (select the correct one)</label><div id="q_o"></div><button class="btn o sm" onclick="addOpt()">+ Add option</button></div>
   <div class="fg" style="max-width:160px"><label>Points</label><input class="in" id="q_pt" type="number" min="1" value="${q?q.points:1}"></div>
   <div style="display:flex;gap:10px"><button class="btn" onclick="saveQ(this)">${q?"Save question":"Add question"}</button>${q?`<button class="btn o" onclick="E.qEdit=null;eExam()">Cancel</button>`:""}</div></div>`;
  E.ans=q?q.answer:0;drawOpts()}
function drawOpts(){$("#q_o").innerHTML=E.opts.map((o,i)=>`<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><input type="radio" name="ca" ${E.ans===i?"checked":""} onchange="E.ans=${i}"><input class="in" value="${esc(o)}" oninput="E.opts[${i}]=this.value" placeholder="Option ${i+1}">${E.opts.length>2?`<button class="btn d sm" onclick="E.opts.splice(${i},1);if(E.ans>=E.opts.length)E.ans=0;drawOpts()">×</button>`:""}</div>`).join("")}
function addOpt(){if(E.opts.length<6){E.opts.push("");drawOpts()}}
const saveExamCfg=b=>run(async()=>{await api("saveCourse",{course:{id:E.id,passMark:Number(val("e_p")),examMinutes:Number(val("e_m")),maxAttempts:Number(val("e_a")),shuffle:val("e_s")==="1"}});toast("Exam settings saved.");editor(E.id)},b);
const saveQ=b=>run(async()=>{const idx=E.opts.map((o,i)=>[o.trim(),i]).filter(x=>x[0]);const ans=idx.findIndex(x=>x[1]===E.ans);
  await api("saveQuestion",{question:{id:E.qEdit||(E.qid=E.qid||nid("Q")),courseId:E.id,text:val("q_t"),options:idx.map(x=>x[0]),answer:ans,points:Number(val("q_pt")||1)}});E.qid=null;toast("Question saved.");E.qEdit=null;editor(E.id)},b);
const delQ=id=>run(async()=>{await api("deleteQuestion",{id});editor(E.id)});

function eCert(){const c=E.course,f=c.certConfig;
  const fld=(k,l)=>`<div class="fg"><label>${l}</label><input class="in" id="c_${k}" value="${esc(f[k])}" oninput="certPrev()"></div>`;
  $("#ep").innerHTML=`<div class="card"><p class="mut" style="margin-bottom:14px">Changes apply to every certificate for this course, including ones already issued.</p>${fld("title","Heading")}${fld("intro","Line above the learner's name")}${fld("body","Line above the course name")}
   <div class="fr">${fld("signer","Signatory name")}${fld("signerTitle","Signatory title")}</div><div class="fr">${fld("footer","Footer note (optional)")}<div class="fg"><label>Accent colour</label><input class="in" id="c_accent" type="color" value="${esc(f.accent)}" oninput="certPrev()" style="height:42px;padding:4px"></div></div>
   <div class="fg"><label><input type="checkbox" id="c_show" ${c.showScore?"checked":""} onchange="certPrev()"> Show the learner's percentage on the certificate</label></div>
   <p class="mut" style="margin-bottom:12px">Pass mark is ${c.passMark}% (change it on the Exam tab).</p><button class="btn" onclick="saveCert(this)">Save certificate</button></div><div class="card"><div class="mut" style="margin-bottom:10px">Preview</div><div id="cprev"></div></div>`;certPrev()}
const certCfg=()=>Object.fromEntries(["title","intro","body","signer","signerTitle","footer","accent"].map(k=>[k,val("c_"+k)]));
function certPrev(){$("#cprev").innerHTML=certHtml({studentName:"Student Name",courseTitle:E.course.title||"Course title",number:"LUX-0000-2026-0000",date:Date.now(),percent:$("#c_show").checked?85:null,config:certCfg()})}
const saveCert=b=>run(async()=>{await api("saveCourse",{course:{id:E.id,certConfig:certCfg(),showScore:$("#c_show").checked}});toast("Certificate saved.");editor(E.id)},b);

theme(document.documentElement.dataset.theme);nav();route();flush();
</script>
